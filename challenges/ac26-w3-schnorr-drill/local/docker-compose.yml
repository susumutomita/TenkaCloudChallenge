# The workbench service is reachable only through a host-loopback publish path and has
# no masqueraded route to the outside world. The verifier is not published at all: it
# is reachable only from the workbench, over the internal `lab` network, which carries
# no gateway -- `workshop-host` exists only because Docker cannot publish a port from an
# internal-only network.
#
# Issue 543/537: the drill used to run a single service that was both the
# participant-facing Portal and the answer-checking verifier, so the eight-line grader's
# expected values shipped in the same image a learner's `docker exec` could read. This
# is a plain, non-general two-service split (see cs-transaction-visibility-audit /
# cs-cache-generation-fence / cs-async-result-binding for the same shape elsewhere in
# this catalog) -- not a new mechanism.
name: ac26-w3-schnorr-drill
services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
      # The participant stage, explicitly. Without this, compose builds the LAST
      # stage -- `author` -- which carries reference/ and mutation.py.
      target: participant
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      WORKBENCH_PORT: "18132"
      VERIFIER_URL: http://verifier:18138/verify
      # Issue 543 option B2: `fixtures/` is not in the participant image any more, so
      # `show.py` and the public tests read this deployment's public numbers from the
      # verifier instead. PortalEditorSupport forwards this one variable (and only this
      # one) into those subprocesses.
      VERIFIER_PUBLIC_URL: http://verifier:18138/public
    ports:
      - "127.0.0.1:18132:18132"
    depends_on:
      verifier:
        condition: service_healthy
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18132/api/config', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab
      - workshop-host

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      VERIFY_PORT: "18138"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18138/healthz', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab

networks:
  lab:
    internal: true
  workshop-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
