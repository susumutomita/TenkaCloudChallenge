services:
  participant:
    build:
      context: .
      dockerfile: Dockerfile
      target: participant
    ports:
      - "127.0.0.1:18110:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - isolated

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    ports:
      - "127.0.0.1:18111:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - isolated

networks:
  isolated:
    internal: true
