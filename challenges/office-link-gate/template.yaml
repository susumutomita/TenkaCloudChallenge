AWSTemplateFormatVersion: 2010-09-09
Description: "AWS introductory team Challenge: real EC2 launch, internet access, Session Manager and HTTP checks."
Parameters:
  NamePrefix:
    Type: String
    MaxLength: 80
    AllowedPattern: ^tc-[a-z0-9]+(-[a-z0-9]+)+$
  TenkaCloudAccountId:
    Type: String
    AllowedPattern: ^[0-9]{12}$
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  PlayKey:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 64
    AllowedPattern: ^[A-Za-z0-9]+$
  ProgressKey:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 64
    AllowedPattern: ^[A-Za-z0-9]+$
  CompletionSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 64
    AllowedPattern: ^[A-Za-z0-9]+$
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.77.0.0/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: Subnet
      RouteTableId:
        Ref: RouteTable
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      GroupDescription: Workshop observation port; learners add HTTP
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  LabNic:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId:
        Ref: Subnet
      GroupSet:
        - Ref: LabSecurityGroup
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  LabAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName:
        Fn::Sub: ${NamePrefix}-session
      Roles:
        - Ref: InstanceRole
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: TenkaCloud:NamePrefix
              Value:
                Ref: NamePrefix
      LaunchTemplateData:
        ImageId:
          Ref: AmiId
        InstanceType: t3.micro
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        NetworkInterfaces:
          - NetworkInterfaceId:
              Ref: LabNic
            DeviceIndex: 0
            DeleteOnTermination: false
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -eu
              install -d -m 755 /opt/office-link
              cat > /opt/office-link/server.py <<'PY'
              """Public lab page and bounded, non-secret network observations on EC2."""
              import json
              import os
              import threading
              import urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              LAB = os.environ["LAB_NAME"]


              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/check":
                          try:
                              with urllib.request.urlopen("https://checkip.amazonaws.com/", timeout=3) as result:
                                  outbound = result.read(128).decode().strip()
                          except (OSError, ValueError):
                              # This is the observation being taught, not a successful check.
                              outbound = None
                          body = json.dumps({"lab": LAB, "outboundIp": outbound,
                              "sessionCommandRan": os.path.isfile("/tmp/office-link-visited"),
                              "sessionCommandAt": os.stat("/tmp/office-link-visited").st_mtime if os.path.isfile("/tmp/office-link-visited") else None}).encode()
                          mime = "application/json"
                      elif self.path == "/":
                          body = ("<!doctype html><html lang=en><meta charset=utf-8><title>Office Link</title>"
                              "<style>body{font:22px system-ui;max-width:45rem;margin:12vh auto;padding:2rem;background:#122940;color:white}"
                              "strong{color:#72e2b2}</style><h1>Office Link</h1><p><strong>Connected / つながりました！</strong></p>"
                              f"<p>{LAB}</p><p>Ask a teammate to check this page. / 仲間にも開いてもらおう。</p></html>").encode()
                          mime = "text/html; charset=utf-8"
                      else:
                          self.send_error(404)
                          return
                      self.send_response(200)
                      self.send_header("Content-Type", mime)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *args):
                      pass


              if __name__ == "__main__":
                  observation = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
                  threading.Thread(target=observation.serve_forever, daemon=True).start()
                  ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()

              PY
              cat > /etc/systemd/system/office-link.service <<'UNIT'
              [Unit]
              Description=Office Link lab page
              After=network.target
              [Service]
              Environment=LAB_NAME=${NamePrefix}
              ExecStart=/usr/bin/python3 /opt/office-link/server.py
              Restart=on-failure
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now office-link.service
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: TenkaCloud:NamePrefix
                Value:
                  Ref: NamePrefix
              - Key: Name
                Value:
                  Fn::Sub: ${NamePrefix}-server
          - ResourceType: volume
            Tags:
              - Key: TenkaCloud:NamePrefix
                Value:
                  Ref: NamePrefix
              - Key: Name
                Value:
                  Fn::Sub: ${NamePrefix}-server
  ParticipantViewerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${TenkaCloudAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SignInLocalDevelopmentAccess
      Policies:
        - PolicyName: OperateOnlyThisLab
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudshell:CreateEnvironment
                  - cloudshell:CreateSession
                  - cloudshell:GetEnvironmentStatus
                  - cloudshell:StartEnvironment
                  - cloudshell:StopEnvironment
                  - cloudshell:DeleteEnvironment
                  - cloudshell:PutCredentials
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeAddresses
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeIamInstanceProfileAssociations
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: AWS::Region
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/${LabNic}
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${LabSecurityGroup}
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet}
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}::image/${AmiId}
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate:
                      Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}
                  Bool:
                    ec2:IsLaunchTemplateResource: "true"
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate:
                      Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}
                  StringEquals:
                    aws:RequestTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
                    ec2:InstanceType: t3.micro
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate:
                      Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}
                  StringEquals:
                    aws:RequestTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
                    ec2:VolumeType: gp3
                  NumericLessThanEquals:
                    ec2:VolumeSize: "8"
              - Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - RunInstances
                      - CreateInternetGateway
                    aws:RequestTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
              - Effect: Allow
                Action:
                  - ec2:CreateInternetGateway
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
              - Effect: Allow
                Action:
                  - ec2:AttachInternetGateway
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${Vpc}
              - Effect: Allow
                Action:
                  - ec2:AttachInternetGateway
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
              - Effect: Allow
                Action:
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/${RouteTable}
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${LabSecurityGroup}
              - Effect: Allow
                Action:
                  - ec2:AssociateIamInstanceProfile
                  - ec2:ReplaceIamInstanceProfileAssociation
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
                  ArnEquals:
                    ec2:InstanceProfile:
                      Fn::GetAtt:
                        - InstanceProfile
                        - Arn
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action:
                  - iam:ListInstanceProfiles
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                Resource:
                  Fn::GetAtt:
                    - InstanceProfile
                    - Arn
              - Effect: Allow
                Action:
                  - iam:GetRole
                Resource:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              - Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstanceProperties
                  - ssm:GetConnectionStatus
                  - ssm:DescribeSessions
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: AWS::Region
              - Effect: Allow
                Action:
                  - ssm:StartSession
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
              - Effect: Allow
                Action:
                  - ssm:StartSession
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/SSM-SessionManagerRunShell
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}::document/SSM-SessionManagerRunShell
              - Effect: Allow
                Action:
                  - ssmmessages:OpenDataChannel
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:userid}-*
              - Effect: Allow
                Action:
                  - ssm:TerminateSession
                  - ssm:ResumeSession
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:userid}-*
  WorkshopLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 1
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  WorkshopRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LabAuthority
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeAddresses
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ssm:DescribeSessions
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: AWS::Region
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - WorkshopLogs
                    - Arn
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${LabAddress.AllocationId}
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/${LabNic}
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/TenkaCloud:NamePrefix:
                      Ref: NamePrefix
  Workshop:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role:
        Fn::GetAtt:
          - WorkshopRole
          - Arn
      LoggingConfig:
        LogGroup:
          Ref: WorkshopLogs
      Environment:
        Variables:
          LAB_CONFIG:
            Fn::Sub: '{"namePrefix": "${NamePrefix}", "serverName": "${NamePrefix}-server", "publicIp": "${LabAddress}", "partition": "${AWS::Partition}", "region": "${AWS::Region}", "accountId": "${AWS::AccountId}", "vpcId": "${Vpc}", "subnetId": "${Subnet}", "networkInterfaceId": "${LabNic}", "allocationId": "${LabAddress.AllocationId}", "routeTableId": "${RouteTable}", "securityGroupId": "${LabSecurityGroup}", "instanceProfileArn": "${InstanceProfile.Arn}", "instanceProfileName": "${InstanceProfile}", "participantRoleName": "${ParticipantViewerRole}", "imageId": "${AmiId}", "instanceType": "t3.micro", "launchTemplateId": "${LaunchTemplate}", "httpSourceCidr": "0.0.0.0/0"}'
          PLAY_KEY:
            Ref: PlayKey
          PROGRESS_KEY:
            Ref: ProgressKey
          FLAG_COMPLETION:
            Ref: CompletionSecret
      Code:
        ZipFile: |
          """Expected negative observations are distinct from operational failures."""
          class NotReady(Exception):
              """A documented observable condition has not been met yet."""


          def require(condition, message):
              if not condition:
                  raise NotReady(message)

          """Service exercises sharing the workshop's AWS client and progress protocol."""

          import json
          import re
          from datetime import datetime, timedelta, timezone


          class ServiceChecks:
              def dynamodb_item(self, status):
                  db=self.client('dynamodb')
                  try:
                      table=db.describe_table(TableName=self.config['tableName'])['Table']
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code')=='ResourceNotFoundException':
                          raise NotReady('Create the named DynamoDB table first') from error
                      raise
                  require(table.get('TableStatus')=='ACTIVE', 'Wait until the DynamoDB table is active')
                  require(table.get('KeySchema')==[{'AttributeName':'recordId','KeyType':'HASH'}] and table.get('AttributeDefinitions')==[{'AttributeName':'recordId','AttributeType':'S'}], 'Use recordId as the string partition key without a sort key')
                  require(table.get('BillingModeSummary',{}).get('BillingMode')=='PAY_PER_REQUEST', 'Use on-demand capacity for this table')
                  require(not table.get('GlobalSecondaryIndexes') and not table.get('LocalSecondaryIndexes'), 'This exercise needs no extra indexes')
                  item=db.get_item(TableName=self.config['tableName'],Key={'recordId':{'S':'handover'}},ConsistentRead=True).get('Item',{})
                  require(item.get('destination')=={'S':'YOKOHAMA'} and item.get('status')=={'S':status}, 'Find handover and check its destination and status')
                  return {'recordId':'handover','status':status,'read':'consistent'}

              def sqs_delivery(self):
                  sqs=self.client('sqs')
                  try:
                      url=sqs.get_queue_url(QueueName=self.config['queueName'],QueueOwnerAWSAccountId=self.config['accountId'])['QueueUrl']
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code') in ('AWS.SimpleQueueService.NonExistentQueue','QueueDoesNotExist'):
                          raise NotReady('Create the named Standard queue first') from error
                      raise
                  attrs=sqs.get_queue_attributes(QueueUrl=url,AttributeNames=['All'])['Attributes']
                  require(attrs.get('QueueArn')==self.config['queueArn'], 'Use the queue assigned to this team')
                  require(attrs.get('FifoQueue','false')=='false' and attrs.get('DelaySeconds')=='0' and attrs.get('MessageRetentionPeriod')=='345600' and attrs.get('VisibilityTimeout')=='30' and not attrs.get('RedrivePolicy'), 'Use Standard queue defaults: no delay, four-day retention, thirty-second visibility')
                  require(attrs.get('SqsManagedSseEnabled')=='true' and not attrs.get('KmsMasterKeyId'), 'Use SQS-managed encryption for this queue')
                  created=datetime.fromtimestamp(int(attrs['CreatedTimestamp']),timezone.utc)
                  now=datetime.now(timezone.utc)
                  require(timedelta(0) <= now-created < timedelta(hours=6), 'Use this event queue within six hours of creation')
                  counts={}
                  for name in ['NumberOfMessagesSent','NumberOfMessagesReceived','NumberOfMessagesDeleted']:
                      metric=self.client('cloudwatch').get_metric_statistics(Namespace='AWS/SQS',MetricName=name,
                          Dimensions=[{'Name':'QueueName','Value':self.config['queueName']}],StartTime=created,EndTime=now+timedelta(minutes=1),Period=60,Statistics=['Sum'])
                      counts[name]=sum(point.get('Sum',0) for point in metric.get('Datapoints',[]))
                  # Counts can include retries. We require evidence of each operation,
                  # not a unique-message count; emptiness alone can never complete.
                  require(all(count>0 for count in counts.values()), 'Wait for AWS to record send, receive, and delete operations; then check again')
                  require(all(attrs.get(name)=='0' for name in ['ApproximateNumberOfMessages','ApproximateNumberOfMessagesNotVisible','ApproximateNumberOfMessagesDelayed']), 'Finish deleting received messages; receiving alone only hides them temporarily')
                  return {'send':'recorded','receive':'recorded','delete':'recorded','queue':'empty'}

              def cpu_alarm(self):
                  result=self.client('cloudwatch').describe_alarms(AlarmNames=[self.config['alarmName']],AlarmTypes=['MetricAlarm'])
                  alarms=result.get('MetricAlarms',[])
                  require(len(alarms)==1, 'Create the named CPU alarm first')
                  alarm=alarms[0]
                  require(alarm.get('Namespace')=='AWS/EC2' and alarm.get('MetricName')=='CPUUtilization' and alarm.get('Dimensions')==[{'Name':'InstanceId','Value':self.config['instanceId']}], 'Select CPUUtilization for the prepared EC2 instance')
                  require(alarm.get('Statistic')=='Average' and alarm.get('Period')==300 and alarm.get('EvaluationPeriods')==1 and alarm.get('DatapointsToAlarm',1)==1 and alarm.get('ComparisonOperator')=='GreaterThanThreshold' and alarm.get('Threshold')==80, 'Use average over five minutes, greater than eighty, with one evaluation')
                  require(not any(alarm.get(name) for name in ['AlarmActions','OKActions','InsufficientDataActions','Metrics']) and not alarm.get('ExtendedStatistic'), 'Create a simple metric alarm without notification or recovery actions')
                  return {'instanceId':self.config['instanceId'],'alarm':'configured','trigger':'not tested'}

              def s3_object(self):
                  s3 = self.client('s3')
                  name = self.config['bucketName']
                  block = s3.get_public_access_block(Bucket=name)['PublicAccessBlockConfiguration']
                  require(all(block.get(key) is True for key in ['BlockPublicAcls','IgnorePublicAcls','BlockPublicPolicy','RestrictPublicBuckets']), 'Keep all four S3 public access blocks enabled')
                  try:
                      result = s3.get_object(Bucket=name, Key=self.config['objectKey'])
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code') in ('NoSuchKey','NoSuchVersion'):
                          raise NotReady('The team file is not saved at the requested key yet') from error
                      raise
                  with result['Body'] as body:
                      data = body.read(8193)
                  try:
                      content=data.decode('utf-8-sig').replace('\r\n','\n').rstrip('\n')
                  except UnicodeError as error:
                      raise NotReady('The current file content differs from the team handover note') from error
                  require(content == self.config['fileContent'].rstrip('\n'), 'The current file content differs from the team handover note')
                  return {'bucket':name, 'key':self.config['objectKey'], 'content':'verified'}

              def s3_restore(self):
                  s3 = self.client('s3')
                  name = self.config['bucketName']
                  require(s3.get_bucket_versioning(Bucket=name).get('Status') == 'Enabled', 'Keep S3 versioning enabled')
                  result = self.s3_object()
                  versions = s3.list_object_versions(Bucket=name, Prefix=self.config['objectKey'], MaxKeys=1000)
                  matching = [v for v in versions.get('Versions',[]) if v['Key']==self.config['objectKey']]
                  require(len(matching) >= 3 and any(v.get('IsLatest') for v in matching), 'Restore the earlier content as a new current version')
                  # Listing a healthy old version alone cannot pass: s3_object reads the
                  # current object without VersionId. Participants cannot delete history.
                  return {**result, 'versions':'preserved', 'currentVersion':'restored'}

              def lambda_record(self, inputs, include_destination=False):
                  receipt=inputs.get('receipt','')
                  require(isinstance(receipt,str) and re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',receipt) is not None, 'Copy the receipt from your Lambda execution result')
                  logs=self.client('logs')
                  request={'logGroupName':self.config['studentLogGroup'],'filterPattern':'"'+receipt+'"','limit':100}
                  previous=None
                  while True:
                      response=logs.filter_log_events(**request)
                      for event in response.get('events',[]):
                          try: record=json.loads(event['message'])
                          except (ValueError,UnicodeError): continue  # Other runtime log lines are not our receipt.
                          if not isinstance(record,dict): continue
                          if record.get('receipt')!=receipt or record.get('team')!=self.config['namePrefix'] or record.get('parcels')!=3:
                              continue
                          if include_destination:
                              require(inputs.get('destination','').strip()==record.get('destination'), 'Read the destination in the log for this receipt')
                          return {'receipt':receipt,'execution':'verified','log':'verified' if include_destination else 'recorded'}
                      token=response.get('nextToken')
                      if not token or token==previous: break
                      previous=token;request['nextToken']=token
                  raise NotReady('The execution receipt is not in this function log yet')

          """AWS observations for the introductory workshop family.

          Resource identities come only from the deployed stack, never from a submitted
          ARN or URL. Clients are injected in unit tests; production uses the AWS SDK.
          No check converts an AWS error into a successful or empty observation.
          """
          import ipaddress
          import json
          import urllib.request
          import urllib.error




          def tags_match(resource, prefix):
              return any(t.get("Key") == "TenkaCloud:NamePrefix" and t.get("Value") == prefix
                         for t in resource.get("Tags", []))


          def fetch_json(url):
              # The caller constructs this URL from the stack's EC2 address. Never follow
              # a student's redirect to another team, metadata endpoint, or private host.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect, urllib.request.ProxyHandler({}))
              try:
                  with opener.open(url, timeout=4) as response:
                      require(response.status == 200, "HTTP response is not 200")
                      data = response.read(8193)
              except (urllib.error.URLError, TimeoutError) as error:
                  raise NotReady("The lab page could not be reached") from error
              require(len(data) <= 8192, "HTTP response is too large")
              try:
                  return json.loads(data)
              except (ValueError, UnicodeError) as error:
                  raise NotReady("The lab page returned invalid data") from error




          class AwsChecks(ServiceChecks):
              def __init__(self, config, clients=None, fetch=fetch_json):
                  self.config = config
                  self.clients = clients if clients is not None else {}
                  self.fetch = fetch

              def client(self, service):
                  if service not in self.clients:
                      import boto3
                      from botocore.config import Config
                      self.clients[service] = boto3.client(service, region_name=self.config["region"],
                          config=Config(connect_timeout=3, read_timeout=5, retries={"max_attempts": 1}))
                  return self.clients[service]

              def instance(self):
                  ec2 = self.client("ec2")
                  nic = ec2.describe_network_interfaces(NetworkInterfaceIds=[self.config["networkInterfaceId"]])["NetworkInterfaces"]
                  require(len(nic) == 1 and nic[0]["VpcId"] == self.config["vpcId"], "Lab network interface does not match")
                  instance_id = nic[0].get("Attachment", {}).get("InstanceId")
                  require(bool(instance_id), "The lab network interface has no running server yet")
                  reservations = ec2.describe_instances(InstanceIds=[instance_id])["Reservations"]
                  instances = [i for r in reservations for i in r.get("Instances", [])]
                  require(len(instances) == 1, "The lab server could not be identified")
                  instance = instances[0]
                  require(instance["VpcId"] == self.config["vpcId"] and instance["SubnetId"] == self.config["subnetId"], "Server is outside the lab network")
                  require(tags_match(instance, self.config["namePrefix"]), "Server does not belong to this lab")
                  require(instance["State"]["Name"] == "running", "Wait for the server to enter running state")
                  require(instance["ImageId"] == self.config["imageId"], "Server image differs from the lab image")
                  require(instance["InstanceType"] == self.config["instanceType"], "Server size differs from the lab size")
                  return instance, nic[0]

              def launch(self):
                  instance, _ = self.instance()
                  statuses = self.client("ec2").describe_instance_status(InstanceIds=[instance["InstanceId"]])["InstanceStatuses"]
                  require(len(statuses) == 1, "AWS has not reported the server checks yet")
                  require(all(statuses[0].get(key, {}).get("Status") == "ok" for key in ("SystemStatus", "InstanceStatus")), "Wait for both EC2 status checks to pass")
                  return {"instanceId": instance["InstanceId"], "state": "running", "checks": "ok"}

              def attached_gateway(self):
                  gateways = self.client("ec2").describe_internet_gateways(Filters=[{"Name": "attachment.vpc-id", "Values": [self.config["vpcId"]]}])["InternetGateways"]
                  require(len(gateways) == 1, "The lab VPC needs an attached internet gateway")
                  gateway = gateways[0]
                  require(tags_match(gateway, self.config["namePrefix"]), "Use the gateway created for this lab")
                  require(any(a.get("VpcId") == self.config["vpcId"] and a.get("State") == "available" for a in gateway.get("Attachments", [])), "Wait for the gateway attachment to become available")
                  return gateway["InternetGatewayId"]

              def gateway(self):
                  gateway_id = self.attached_gateway()
                  # Existing interfaces cannot request auto-assigned public IPv4 at
                  # launch. The host supplies one reserved EIP only after the learner
                  # connects the IGW. This is setup assistance, explicitly shown in UI.
                  ec2 = self.client("ec2")
                  addresses = ec2.describe_addresses(AllocationIds=[self.config["allocationId"]])["Addresses"]
                  require(len(addresses) == 1, "The host's lab address is unavailable")
                  address = addresses[0]
                  require(address.get("NetworkInterfaceId") in (None, self.config["networkInterfaceId"]), "The lab address is attached to a different resource")
                  if not address.get("AssociationId"):
                      ec2.associate_address(AllocationId=self.config["allocationId"], NetworkInterfaceId=self.config["networkInterfaceId"], AllowReassociation=False)
                  return {"gatewayId": gateway_id, "publicIp": address["PublicIp"]}

              def route_config(self):
                  gateway_id = self.attached_gateway()
                  tables = self.client("ec2").describe_route_tables(RouteTableIds=[self.config["routeTableId"]])["RouteTables"]
                  require(len(tables) == 1 and tables[0]["VpcId"] == self.config["vpcId"], "The route table does not belong to this lab")
                  table = tables[0]
                  require(any(a.get("SubnetId") == self.config["subnetId"] and a.get("AssociationState", {}).get("State") == "associated" for a in table.get("Associations", [])), "The route table is not associated with the lab subnet")
                  require(any(r.get("DestinationCidrBlock") == "0.0.0.0/0" and r.get("GatewayId") == gateway_id and r.get("State") == "active" for r in table.get("Routes", [])), "The subnet needs an active route to its attached internet gateway")
                  return gateway_id

              def server_response(self, port):
                  instance, nic = self.instance()
                  address = nic.get("Association", {}).get("PublicIp")
                  require(bool(address), "The lab server has no public address yet")
                  require(ipaddress.ip_address(address).is_global, "The lab address must be a public IP")
                  data = self.fetch(f"http://{address}:{port}/check")
                  require(isinstance(data, dict) and data.get("lab") == self.config["namePrefix"], "The responding server is not this team's lab")
                  return instance, address, data

              def route(self):
                  gateway_id = self.route_config()
                  _, address, data = self.server_response(8080)
                  require(data.get("outboundIp") == address, "The lab server's outbound HTTPS check did not succeed")
                  return {"gatewayId": gateway_id, "outboundHttps": True}

              def session(self, after=0):
                  instance, _, data = self.server_response(8080)
                  require(instance.get("IamInstanceProfile", {}).get("Arn") == self.config["instanceProfileArn"], "The lab's Session Manager role is not attached")
                  require(data.get("sessionCommandRan") is True, "Run the workshop check command inside your Session Manager session")
                  if after:
                      require(isinstance(data.get("sessionCommandAt"), (int, float)) and data['sessionCommandAt'] >= after, "Run the check command again after this recovery round started")
                  expected_owner = f"arn:{self.config.get('partition', 'aws')}:sts::{self.config['accountId']}:assumed-role/{self.config['participantRoleName']}/"
                  ssm = self.client("ssm")
                  for state in ("Active", "History"):
                      request = {"State": state, "Filters": [{"key": "Target", "value": instance["InstanceId"]}]}
                      while True:
                          result = ssm.describe_sessions(**request)
                          if any(s.get("Target") == instance["InstanceId"] and s.get("Owner", "").startswith(expected_owner)
                                 and (not after or (s.get('StartDate') is not None and s['StartDate'].timestamp() >= after)) for s in result.get("Sessions", [])):
                              return {"instanceId": instance["InstanceId"], "session": "verified", "command": "verified"}
                          if not result.get("NextToken"):
                              break
                          request["NextToken"] = result["NextToken"]
                  raise NotReady("No Session Manager session from this team's participant role was found")

              def http(self):
                  self.route_config()
                  instance, nic = self.instance()
                  # Additional attached groups could make a too-wide rule effective even
                  # if the expected group looks correct. Check the actual NIC's groups.
                  require({g["GroupId"] for g in nic.get("Groups", [])} == {self.config["securityGroupId"]}, "Use only the lab security group")
                  groups = self.client("ec2").describe_security_groups(GroupIds=[self.config["securityGroupId"]])["SecurityGroups"]
                  require(len(groups) == 1 and groups[0]["VpcId"] == self.config["vpcId"], "Security group does not belong to the lab")
                  required = ("tcp", 80, 80, self.config["httpSourceCidr"])
                  control = ("tcp", 8080, 8080, "0.0.0.0/0")
                  actual = set()
                  for permission in groups[0].get("IpPermissions", []):
                      require(not permission.get("Ipv6Ranges") and not permission.get("UserIdGroupPairs") and not permission.get("PrefixListIds"), "Remove unrelated inbound permissions")
                      for source in permission.get("IpRanges", []):
                          actual.add((permission.get("IpProtocol"), permission.get("FromPort"), permission.get("ToPort"), source["CidrIp"]))
                  require(actual == {required, control}, "Allow the requested HTTP source and keep only the lab's fixed observation port")
                  _, address, data = self.server_response(80)
                  require(data.get("outboundIp") == address, "The lab server's outbound HTTPS check did not succeed")
                  return {"instanceId": instance["InstanceId"], "httpStatus": 200, "sourceCidr": self.config["httpSourceCidr"]}

              def run(self, kind, inputs=None):
                  if kind in ("dynamodb-create", "dynamodb-update"):
                      return self.dynamodb_item("waiting" if kind == "dynamodb-create" else "done")
                  if kind in ("lambda-run", "lambda-logs"):
                      return self.lambda_record(inputs or {}, kind == "lambda-logs")
                  allowed = {"launch": self.launch, "gateway": self.gateway, "route": self.route,
                             "session": self.session, "http": self.http, "s3-save": self.s3_object, "s3-restore": self.s3_restore,
                             "sqs": self.sqs_delivery, "cpu-alarm": self.cpu_alarm}
                  if kind not in allowed:
                      raise ValueError("Unsupported AWS check")
                  return allowed[kind]()

          """Signed, sequential progress around real AWS checks; no early scoring flag."""
          import base64
          import hashlib
          import hmac
          import json
          import os
          from urllib.parse import parse_qs


          WEB_HTML = ""
          WEB_JS = ""
          WEB_CSS = ""
          CURRICULUM = {}
          OBSERVATIONS = {}


          def choose(value, language):
              return value[language] if isinstance(value, dict) and "ja" in value and "en" in value else value


          def localized(value, language):
              if isinstance(value, list):
                  return [localized(item, language) for item in value]
              if isinstance(value, dict):
                  if "ja" in value and "en" in value:
                      return value[language]
                  return {key: localized(item, language) for key, item in value.items() if key != "correctChoice"}
              return value


          def secret(name):
              value = os.environ[name]
              if len(value) < 24:
                  raise ValueError("Workshop secrets must contain at least 24 characters")
              return value


          def signature(stage):
              payload = f"aws-intro:v1:{CURRICULUM['id']}:{stage}".encode()
              return hmac.new(secret("PROGRESS_KEY").encode(), payload, hashlib.sha256).hexdigest()


          def receipt(stage):
              return f"{stage}.{signature(stage)}" if stage else ""


          def read_receipt(value):
              if value == "":
                  return 0
              if not isinstance(value, str) or len(value) > 100:
                  return None
              for stage in range(1, 2 * len(CURRICULUM["missions"]) + 1):
                  if hmac.compare_digest(value.encode(), receipt(stage).encode()):
                      return stage
              return None


          def response(status, data, mime="application/json; charset=utf-8"):
              return {"statusCode": status, "headers": {
                  "content-type": mime, "cache-control": "no-store", "referrer-policy": "no-referrer",
                  "x-content-type-options": "nosniff",
                  "content-security-policy": "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'",
              }, "body": data if isinstance(data, str) else json.dumps(data, ensure_ascii=False)}


          def configuration():
              return json.loads(os.environ["LAB_CONFIG"])


          def view(stage, language):
              count = len(CURRICULUM["missions"])
              done = stage == count * 2
              data = {"stage": stage, "total": count, "done": done, "token": receipt(stage),
                  "title": choose(CURRICULUM["title"], language), "mode": "aws", "problemId": CURRICULUM["id"],
                  "steps": [choose(m["title"], language) for m in CURRICULUM["missions"]]}
              if done:
                  data["flag"] = "TC{" + secret("FLAG_COMPLETION") + "}"
              else:
                  mission = CURRICULUM["missions"][stage // 2]
                  data["mission"] = localized(mission, language)
                  data["phase"] = "explain" if stage % 2 else "operate"
                  config = configuration()
                  # Only explicitly public resource hints cross the boundary. Never
                  # spread environment variables, flags, or arbitrary configuration.
                  public_keys = {"tableName", "queueName", "alarmName", "instanceId", "functionName", "studentLogGroup", "testEvent", "bucketName", "objectKey", "fileContent", "namePrefix", "region", "vpcId", "subnetId", "networkInterfaceId", "routeTableId",
                      "serverName", "publicIp", "securityGroupId", "instanceProfileName", "instanceType", "imageId", "launchTemplateId", "httpSourceCidr"}
                  data["resources"] = {key: value for key, value in config.items() if key in public_keys}
              return data


          def handler(event, context=None):
              parts = event.get("rawPath", "").split("/", 2)
              if len(parts) != 3 or not hmac.compare_digest(parts[1].encode(), secret("PLAY_KEY").encode()):
                  return response(404, {"error": "not_found"})
              route = parts[2]
              method = event.get("requestContext", {}).get("http", {}).get("method", "GET")
              language = "en" if parse_qs(event.get("rawQueryString", "")).get("lang") == ["en"] else "ja"
              if method == "GET":
                  if route == "starter.txt" and CURRICULUM.get("labKind") == "s3-save":
                      result = response(200, configuration()["fileContent"], "text/plain; charset=utf-8")
                      result["headers"]["content-disposition"] = 'attachment; filename="handover.txt"'
                      return result
                  assets = {"": (WEB_HTML, "text/html"), "app.js": (WEB_JS, "text/javascript"), "style.css": (WEB_CSS, "text/css")}
                  return response(200, assets[route][0], assets[route][1] + "; charset=utf-8") if route in assets else response(404, {"error": "not_found"})
              if method != "POST" or route not in ("api/state", "api/check"):
                  return response(405, {"error": "method_not_allowed"})
              raw = event.get("body") or ""
              if len(raw) > 8192:
                  return response(413, {"error": "too_large"})
              try:
                  if event.get("isBase64Encoded"):
                      raw = base64.b64decode(raw, validate=True).decode("utf-8")
                  data = json.loads(raw)
              except (ValueError, UnicodeError):
                  return response(400, {"error": "invalid_json"})
              if not isinstance(data, dict):
                  return response(400, {"error": "invalid_submission"})
              stage = read_receipt(data.get("token", ""))
              if stage is None:
                  return response(403, {"error": "invalid_progress"})
              if route == "api/state":
                  return response(200, view(stage, language))
              if type(data.get("stage")) is not int or data["stage"] != stage or stage == 2 * len(CURRICULUM["missions"]):
                  return response(409, {"error": "wrong_stage"})
              mission = CURRICULUM["missions"][stage // 2]
              if stage % 2:
                  if data.get("choice") != str(mission["correctChoice"]):
                      return response(200, {"correct": False, "message": choose({"ja": "構成図と、操作した前後の違いを仲間と見比べよう。", "en": "Compare the diagram and the before/after change together."}, language)})
                  evidence = {}
              else:
                  try:
                      inputs = data.get("inputs", {})
                      if not isinstance(inputs, dict) or any(not isinstance(value, str) or len(value) > 256 for value in inputs.values()):
                          return response(400, {"error": "invalid_inputs"})
                      checker = AwsChecks(configuration())
                      evidence = checker.run(mission["check"], inputs) if mission.get("inputs") else checker.run(mission["check"])
                  except NotReady as error:
                      return response(200, {"correct": False, "message": choose({"ja": "まだ確認できません。AWSの観測結果を手掛かりに、手順を確かめてください。", "en": "Not ready yet. Use the AWS observation to check your steps."}, language), "observation": OBSERVATIONS.get(str(error), str(error)) if language == "ja" else str(error)})
                  except Exception as error:
                      # Do not turn AccessDenied, timeouts, or malformed AWS replies into
                      # an incorrect answer. This is an operational error; keep progress.
                      code = getattr(error, "response", {}).get("Error", {}).get("Code", type(error).__name__)
                      return response(503, {"error": "aws_check_failed", "code": code})
              return response(200, {"correct": True, "evidence": evidence, **view(stage + 1, language)})

          CURRICULUM = {'id': 'office-link-gate', 'title': {'ja': '開通ミッション：チームの拠点をつなげよう', 'en': "Connection mission: bring your team's site online"}, 'missions': [{'check': 'launch', 'title': {'ja': '1台目のサーバーを起動', 'en': 'Launch your first server'}, 'goal': {'ja': '別の拠点の仲間へページを届けます。ページのプログラムは準備済み。まず、それを動かすEC2を1台起動しよう。', 'en': 'Deliver a page to teammates at another site. The page program is already prepared. First, launch one EC2 server to run it.'}, 'concept': {'ja': 'EC2はAWSで借りるコンピューターで、1台をインスタンスと呼びます。起動テンプレートは、基本ソフト（OS）やサイズをまとめた設定表。ステータスチェックはサーバーが正常かを確かめる検査です。', 'en': 'EC2 is a computer you rent on AWS; one server is called an instance. A launch template specifies its operating system (OS) and size. Status checks test the server’s health.'}, 'console': 'launch', 'resourceKeys': ['launchTemplateId', 'instanceType', 'imageId', 'serverName'], 'steps': {'ja': ['AWSコンソールで、下のIDと同じ起動テンプレートを選ぶ。', '「テンプレートからインスタンスを起動」を開く。設定はそのまま、台数を1にして起動する。', '起動完了画面のインスタンスID（i-で始まる番号）をチームで控える。状態が「実行中」、チェックが正常になったら「操作できたか確かめる」を押す。'], 'en': ['In the AWS console, select the launch template matching the ID below.', 'Choose Launch instance from template. Keep its settings and launch exactly one instance.', 'Share the instance ID (starting i-) from the launch result. Wait for Running and healthy checks, then press Check my AWS changes.']}, 'success': {'ja': '実行中のEC2と、正常なステータスチェックが見える。', 'en': 'An EC2 instance is running and its status checks are healthy.'}, 'question': {'ja': '起動ボタンを押した直後は「起動中」でした。仲間へ完了と伝える前に見るのは？', 'en': 'Right after launch it said Pending. What should you check before handing over?'}, 'choices': {'ja': ['ボタンを押した時刻だけ', '実行中の状態とステータスチェック', 'チーム名の文字数'], 'en': ['Only when the button was pressed', 'Running state and status checks', 'The length of the team name']}, 'correctChoice': 1, 'hints': {'ja': ['起動は受付と完了が別です。チェックはAWSがサーバーの健康を確かめた結果です。', '変更前：状態「起動中」、チェック「初期化中」。変更後：状態「実行中」、チェック正常。ボタンを押しただけでは後者になりません。', '下の起動テンプレートIDを探す → 1台起動 → インスタンス一覧の状態とチェックを見る → この画面で確かめる。'], 'en': ["Requesting a launch is different from completing it. Checks report the server's health.", 'Before: Pending, checks Initializing. After: Running, checks healthy. Clicking Launch alone is not the latter.', 'Find the template ID below → launch one instance → inspect state and checks → verify here.']}, 'source': 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EC2_GetStarted.html', 'diagram': {'ja': ['EC2（サーバー）', '通信の道案内', 'IGW（出口）', 'インターネット'], 'en': ['EC2 server', 'Route directions', 'IGW exit', 'Internet']}, 'diagramFocus': 0, 'explanationHints': {'ja': ['起動の依頼と、使える状態になることは別です。EC2の状態と、AWSが調べるステータスチェックで確認します。', '前：起動中で準備が続いている。後：実行中になり、ステータスチェックも成功する。押した時刻だけではこの違いを判断できません。', '問題文の「起動中」に注目 → 状態が変わったか確認 → チェック結果も確認。この2つを確かめる選択肢を仲間へ説明しよう。'], 'en': ['Requesting launch and having a usable server are different. EC2 state and AWS status checks provide the evidence.', 'Before: Pending, still preparing. After: Running with successful status checks. A click timestamp cannot distinguish these states.', 'Find Pending in the question → check the resulting state → check the status checks. Explain which choice checks both.']}}, {'check': 'gateway', 'title': {'ja': '拠点にインターネットの出口を作る', 'en': 'Give the site an internet exit'}, 'goal': {'ja': 'サーバーは起動しました。外の仲間と通信できるよう、拠点のネットワークに出口をつなごう。', 'en': 'Your server is running. Connect an exit to its network so it can reach the outside world.'}, 'concept': {'ja': 'VPCはチーム専用のネットワーク。インターネットゲートウェイ（IGW）は、そのネットワークをインターネットへつなぐ出口です。 タグは資源につける名札で、キーが項目名、値がその内容。公開IPはインターネットからこのサーバーを探すための住所です。', 'en': "A VPC is your team's network. An internet gateway (IGW) connects that network to the internet. Tags label resources: the key names a field and the value is its content. A public IP is the server’s address on the internet."}, 'console': 'gateway', 'resourceKeys': ['vpcId', 'namePrefix'], 'steps': {'ja': ['VPCコンソールの「インターネットゲートウェイ」で新しく作成する。', 'タグのキーを TenkaCloud:NamePrefix、値を下のチーム識別名にする。', '作った出口を「VPCにアタッチ」で下のVPC IDへ接続する。この画面の「操作できたか確かめる」を押すと、演習側が公開IPを設定して結果に表示します。'], 'en': ['Create an internet gateway in the VPC console.', 'Add tag key TenkaCloud:NamePrefix with the team identifier below as its value.', 'Attach the gateway to the VPC ID below. Return and press Check my AWS changes: the lab assigns the public IP and displays it in the result.']}, 'success': {'ja': '出口の接続先が自分のVPCになる。通信経路は次のミッションで設定します。', 'en': 'The gateway is attached to your VPC. The next mission adds the route.'}, 'question': {'ja': '出口を作っただけでは、なぜまだ足りない？', 'en': 'Why is creating a gateway alone not enough?'}, 'choices': {'ja': ['どのVPCの出口か、接続先を決める必要がある', 'サーバー名を長くする必要がある', 'EC2をもう1台増やす必要がある'], 'en': ['It must be attached to the VPC it serves', 'The server needs a longer name', 'A second EC2 instance is required']}, 'correctChoice': 0, 'hints': {'ja': ['出口は、使いたいネットワークへ接続して初めて役立ちます。', '変更前：作ったIGWの接続先は空欄。アタッチ後：接続先に指定したVPC IDが表示されます。', '作ったIGWを選ぶ → アクション → VPCにアタッチ → 下のVPC IDを選ぶ → 接続先を確認する。'], 'en': ['An exit must connect to the network that needs it.', 'Before: the new IGW has no attachment. After: its attachment shows your VPC ID.', 'Select your IGW → Actions → Attach to VPC → select the VPC ID below → check the attachment.']}, 'source': 'https://docs.aws.amazon.com/vpc/latest/userguide/working-with-igw.html', 'diagram': {'ja': ['EC2（サーバー）', '通信の道案内', 'IGW（出口）', 'インターネット'], 'en': ['EC2 server', 'Route directions', 'IGW exit', 'Internet']}, 'diagramFocus': 2, 'explanationHints': {'ja': ['IGWはVPCとインターネットを結ぶ出口です。作成は出口を用意する操作、アタッチはその出口を拠点へつなぐ操作です。', '前：IGWは一覧にあるが、どのVPCにも付いていない。後：VPCのIDが接続先として表示される。数は同じ1個でも通信のつながりが変わります。', '「作っただけ」のIGWと図のVPCを見る → 足りないのは物の数か、物同士のつながりかを比べる → 必要な接続先を説明する選択肢を選ぼう。'], 'en': ['An IGW connects a VPC to the internet. Creating provides the gateway; attaching connects it to a site.', 'Before: the gateway exists without a VPC. After: its attachment shows the VPC ID. The gateway count stays one, but connectivity changes.', 'Compare the created gateway with the VPC in the diagram → decide whether a resource or a connection is missing → choose the explanation about that connection.']}}, {'check': 'route', 'title': {'ja': '出口までの道案内を足す', 'en': 'Add directions to the exit'}, 'goal': {'ja': '出口はできました。外へ送る通信がその出口へ向かうよう、経路を1本追加しよう。', 'en': 'The exit exists. Add one route so outbound traffic finds it.'}, 'concept': {'ja': 'サブネットはVPCの中の区画。ルートテーブルは通信先ごとの道案内で、関連付けた区画で使われます。宛先 0.0.0.0/0 は、ほかに具体的な案内がないインターネットの宛先全体。ターゲットは通信を次に渡す先です。', 'en': 'A subnet is a section of a VPC. Its associated route table directs traffic. Destination 0.0.0.0/0 covers internet destinations without a more specific route. The target is where traffic goes next.'}, 'console': 'route', 'resourceKeys': ['routeTableId', 'subnetId'], 'steps': {'ja': ['下のルートテーブルIDを開き、サブネットの関連付けが下のIDと一致するか確認する。', 'ルートを編集し、送信先 0.0.0.0/0、ターゲットを先ほどのIGWにして追加する。', '「操作できたか確かめる」を押す。観測プログラムがEC2から外へHTTPS（通信内容を保護するWeb通信）を試し、成功を表示します。'], 'en': ['Open the route table below and check its subnet association.', 'Edit routes: add destination 0.0.0.0/0 with your IGW as target.', 'Press Check my AWS changes. The observation program tests an outbound HTTPS request (protected web traffic) and reports success.']}, 'success': {'ja': '有効な経路ができ、EC2から外への通信が確認できる。', 'en': "The route is active and EC2's outbound connection succeeds."}, 'question': {'ja': '別のサブネットのルートテーブルを直しても、このEC2がつながらないのはなぜ？', 'en': "Why does changing another subnet's route table not fix this EC2?"}, 'choices': {'ja': ['経路はサーバーの名前で決まるから', 'どの表でも自動で全サブネットへ適用されるから', 'EC2がいるサブネットに関連付いた表が使われるから'], 'en': ['Routes depend on the server name', 'Every table applies to every subnet automatically', 'EC2 uses the table associated with its subnet']}, 'correctChoice': 2, 'hints': {'ja': ['出口があっても、通信がそこへ進む道案内が必要です。', '変更前：表に区画内の経路だけがある。変更後：宛先 0.0.0.0/0、ターゲット igw-…、状態「有効」の行が増えます。', '下の表を開く → サブネットを照合 → 0.0.0.0/0 を追加 → ターゲットに自分のIGW → 保存 → 確かめる。'], 'en': ['An exit also needs a route directing traffic towards it.', 'Before: only a local route exists. After: a row has destination 0.0.0.0/0, target igw-…, and state Active.', 'Open the table → match the subnet → add 0.0.0.0/0 → target your IGW → save → verify.']}, 'source': 'https://docs.aws.amazon.com/vpc/latest/userguide/working-with-igw.html', 'diagram': {'ja': ['EC2（サーバー）', '通信の道案内', 'IGW（出口）', 'インターネット'], 'en': ['EC2 server', 'Route directions', 'IGW exit', 'Internet']}, 'diagramFocus': 1, 'explanationHints': {'ja': ['EC2の通信は、そのEC2がいるサブネットに関連付いたルートテーブルを使います。別の表を編集しても、この対応は変わりません。', '例：拠点Aは表A、拠点Bは表Bを使う。表Bに出口を書いても、拠点Aが読む表Aには道が増えません。', 'このEC2のサブネットIDを確認 → 関連付けられた表を確認 → 「別のサブネットの表」との違いを説明できる選択肢を選ぼう。'], 'en': ['EC2 uses the route table associated with its subnet. Editing another table does not change that association.', 'Example: site A uses table A and site B uses table B. Adding an exit to B does not add directions to A.', 'Identify this EC2 subnet → identify its associated table → choose the explanation distinguishing it from another subnet’s table.']}}, {'check': 'session', 'title': {'ja': 'サーバーの中へ入って確認', 'en': 'Step inside the server'}, 'goal': {'ja': '外との通信ができました。サーバーに接続して、仲間へ引き継ぐ確認コマンドを動かそう。', 'en': 'The network works. Connect to the server and run the handover check.'}, 'concept': {'ja': 'IAMロールは、AWSでできる操作をまとめた権限。Session Managerは、鍵ファイルを配らずにサーバーのコマンド画面へ入る仕組みです。接続用プログラムは準備済みですが、EC2側にも接続用の権限が必要です。', 'en': 'An IAM role grants permissions for AWS actions. Session Manager opens a command screen on a server without distributing key files. Its connection agent is already installed; EC2 still needs the required permissions.'}, 'console': 'instance', 'resourceKeys': ['serverName', 'instanceProfileName'], 'steps': {'ja': ['EC2一覧で下のサーバー名を探し、控えたインスタンスIDと照合。アクション → セキュリティ → IAMロールを変更で下のロールを付ける。', '「接続」→ Session Managerを開く。接続ボタンが使えなければ数分待って再表示し、IAMロールと前のミッションの経路を確かめる。', '接続後、touch /tmp/office-link-visited を入力してEnter。サーバー内に確認の印を残します。通常は文字が表示されません。この画面へ戻って「操作できたか確かめる」を押す。'], 'en': ['Find the server name below in EC2 and match the instance ID you recorded. Actions → Security → Modify IAM role: attach the role shown below.', 'Open Connect → Session Manager. If Connect is unavailable, wait a few minutes, refresh, and check the role and the previous mission’s route.', 'Enter touch /tmp/office-link-visited and press Enter. It leaves a handover marker; normally nothing is printed. Return here and press Check my AWS changes.']}, 'success': {'ja': 'チームのSession Manager接続と、サーバー内でのコマンド実行が確認できる。', 'en': "The team's Session Manager connection and command execution are verified."}, 'question': {'ja': 'ネットワークは正常なのにSession Managerで入れません。EC2側で確かめるものは？', 'en': 'The network works, but Session Manager does not. What should you check on EC2?'}, 'choices': {'ja': ['ページの背景色', '接続に必要なIAMロールが付いているか', 'ページを見るために全通信を許可したか'], 'en': ["The page's background colour", 'Whether the required IAM role is attached', 'Whether all traffic was allowed to view the page']}, 'correctChoice': 1, 'hints': {'ja': ['通信できることと、AWSのサービスを利用する権限があることは別です。', '変更前：EC2のIAMロールが空欄。変更後：演習用ロールが表示され、接続後に touch /tmp/office-link-visited を実行できます。通常、成功時の出力は空です。', 'EC2のIAMロールを下の名前と照合 → 正しいロールを付ける → Session Managerで接続 → touchコマンド → この画面で確認。'], 'en': ['Network access and permission to use an AWS service are separate.', 'Before: EC2 has no IAM role. After: it shows the lab role and you can connect and run touch /tmp/office-link-visited. Success normally prints nothing.', "Match EC2's role to the name below → attach it → connect with Session Manager → run touch → verify here."]}, 'source': 'https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-getting-started-instance-profile.html', 'diagram': {'ja': ['EC2（サーバー）', '通信の道案内', 'IGW（出口）', 'インターネット'], 'en': ['EC2 server', 'Route directions', 'IGW exit', 'Internet']}, 'diagramFocus': 0, 'explanationHints': {'ja': ['通信の道と、AWSサービスを使う権限は別です。Session ManagerにはEC2側の権限も必要です。', '例：ページは開けるのに管理接続ができない。通信が通っていても、EC2のロールがなければ必要なAWS操作を実行できません。', '問題文ではネットワークは正常 → 直す対象を通信から権限へ絞る → EC2に付いているものを確かめる選択肢を選ぼう。'], 'en': ['A network path and permissions to use AWS services are separate. Session Manager also needs EC2-side permissions.', 'Example: a page opens but management access fails. Working networking does not grant the AWS permissions provided by the EC2 role.', 'The question says networking works → focus on permissions → select the check for what is attached to EC2.']}}, {'check': 'http', 'title': {'ja': '仲間へWebページを届ける', 'en': 'Deliver the page to your teammates'}, 'goal': {'ja': 'サーバーに入れました。最後に、仲間のブラウザからチームのページを開けるようにしよう。', 'en': 'You can manage the server. Now let your teammates open its page in a browser.'}, 'concept': {'ja': 'セキュリティグループは通信を許可するルール。ポートは通信の用途を分ける番号で、このページはHTTP（Webページの通信）の80番を使います。インバウンドは外から入る方向。接続元は入ってくる相手で、0.0.0.0/0 は全インターネットを表します。', 'en': 'A security group lists allowed traffic. A port number identifies its purpose; this page uses HTTP (web traffic) on port 80. Inbound means entering the server. Source is who may connect; 0.0.0.0/0 covers the internet.'}, 'console': 'security', 'resourceKeys': ['serverName', 'securityGroupId', 'httpSourceCidr', 'publicIp'], 'steps': {'ja': ['下のセキュリティグループを開き、インバウンドルールを編集する。', '種類「HTTP」を選ぶと通信方式「TCP」と80番が入る。接続元は下の指定を使う。演習の観測用8080番は残し、ルールを保存する。', '下の「チームのページを開く」から仲間にも表示を試してもらう。「操作できたか確かめる」でHTTP 200（ページ取得成功）が出るか確認する。'], 'en': ['Open the security group below and edit inbound rules.', 'Select type HTTP; TCP (the transport method) and port 80 are filled in. Use the source below. Keep the fixed observation rule for port 8080 and save.', 'Use Open the team page below and ask a teammate to try it too. Press Check my AWS changes to verify HTTP 200 (page received successfully).']}, 'success': {'ja': '必要な通信だけを許可し、チームのページがHTTP 200で応答する。', 'en': 'Only the required traffic is allowed and the team page returns HTTP 200.'}, 'question': {'ja': '別拠点の相談です（この演習環境は変更しません）。HTTPのページは8081番で待ち、仲間203.0.113.7だけに見せたい。/32 は指定したIP 1個だけを表します。経路と管理接続は正常です。URLと入口のルールをどう組み合わせますか？', 'en': 'A different site asks for advice (do not change this lab). Its HTTP page listens on port 8081 and only teammate 203.0.113.7 should access it. /32 means that one IP address. Routing and management access work. Which URL and entrance rule fit?'}, 'choices': {'ja': ['URLは http://サーバーIP:8081/、TCP 8081を203.0.113.7/32だけに許可', 'URLは http://サーバーIP/、TCP 80を203.0.113.7/32だけに許可', 'URLは http://サーバーIP:8081/、TCP 8081を全インターネットに許可'], 'en': ['Use http://server-IP:8081/ and allow TCP 8081 only from 203.0.113.7/32', 'Use http://server-IP/ and allow TCP 80 only from 203.0.113.7/32', 'Use http://server-IP:8081/ and allow TCP 8081 from the whole internet']}, 'correctChoice': 0, 'hints': {'ja': ['表示できることと、開けすぎていないことを両方確かめます。', '変更前：8080番だけ許可。変更後：HTTP 80番を指定の接続元に許可する行が増え、ページが表示されます。', 'HTTP 80番と指定の接続元を追加 → 8080番以外の不要な許可を追加していないか確認 → ページを開く → この画面で確かめる。'], 'en': ['Check both that it works and that access is not too broad.', 'Before: only port 8080 is allowed. After: a rule allows HTTP port 80 from the specified source and the page loads.', 'Add HTTP 80 and the specified source → keep only the fixed 8080 rule alongside it → open the page → verify here.']}, 'source': 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html', 'diagram': {'ja': ['EC2（サーバー）', '通信の道案内', 'IGW（出口）', 'インターネット'], 'en': ['EC2 server', 'Route directions', 'IGW exit', 'Internet']}, 'diagramFocus': 0, 'explanationHints': {'ja': ['ブラウザが向かうポートと、入口で許可するポートが一致して初めて届きます。接続元の指定は「誰を通すか」です。', '例：ページが9000番で待ち、仲間が1人だけなら、URLを http://サーバーIP:9000/ にし、入口も9000番をその人のIPだけに許可します。80番のままでは一致しません。', '今回のページは8081番 → サーバーIPの直後、/ より前の :8081 を確認 → ルールのTCP 8081を確認 → 接続元203.0.113.7/32を確認。3つとも一致する提案を選ぼう。'], 'en': ['The browser destination port must match the port allowed at the entrance. The source restriction decides who may enter.', 'Example: a page listens on 9000 for one teammate. Use http://server-IP:9000/ and allow port 9000 from that person’s IP. Leaving port 80 does not match.', 'This page uses 8081 → check :8081 directly after the server IP and before / → check TCP 8081 in the rule → check source 203.0.113.7/32. Select the proposal matching all three.']}}]}
