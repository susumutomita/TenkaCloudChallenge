services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
      target: participant
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      WORKBENCH_PORT: "18570"
      VERIFIER_URL: http://verifier:18571/verify
    ports:
      - "127.0.0.1:18570:18570"
    depends_on:
      verifier:
        condition: service_healthy
    networks:
      - lab
      - workshop-host
    read_only: true
    tmpfs:
      # The measurement compiles and runs from here, so it needs exec. Docker
      # mounts a tmpfs noexec by default and naming other options does not
      # override that, so `exec` has to be said out loud or the compiled binary
      # cannot be started at all. Everything else is still denied, and the arena
      # wants room.
      - /tmp:rw,exec,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18570/api/config', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
    # The arena is 64 MiB; the limit leaves headroom for its construction and
    # for the compiler without perturbing the timing it is protecting.
    mem_limit: 1g
    pids_limit: 128
    cpus: "1.0"

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      VERIFY_PORT: "18571"
    networks:
      - lab
    read_only: true
    tmpfs:
      # Same as the Workbench: grading compiles and runs the measurement here.
      - /tmp:rw,exec,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18571/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    pids_limit: 128
    cpus: "1.0"

networks:
  lab:
    internal: true
  workshop-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
