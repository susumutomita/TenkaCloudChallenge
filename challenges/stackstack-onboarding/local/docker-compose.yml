# Local-play container for stackstack-onboarding.
#
# The image is the shared StackStack base app (../../../stackstack-base), not a
# copy of it: the onboarding problem and every later StackStack problem act on
# the same board. The relative build context resolves against this directory —
# the platform's local runner pins `--project-directory` here even when it
# rewrites host ports, so this works at any port offset.
#
# Both published ports are bound to 127.0.0.1 only: neither the board nor
# /verify leaves the box.
services:
  stackstack-onboarding:
    build:
      context: ../../../stackstack-base
      dockerfile: Dockerfile
    environment:
      SCENARIO: onboarding
      # The path the participant has to open, which is not the path the app sees
      # (the config is mounted at /app/config). Display only.
      CONFIG_HINT: challenges/stackstack-onboarding/local/config/app.json
      # Per-deploy random secret injected by `make local`. The board serial, the
      # boot-check value, and the handover token are all derived from it inside
      # the container.
      FLAG_SEED: "${FLAG_SEED:-local-dev-seed}"
    volumes:
      # The participant's own checkout, read-only. Editing this file is the
      # problem's one required change, and the app re-reads it per request so a
      # save takes effect without a restart.
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:18080:8080" # the board
      - "127.0.0.1:18081:8081" # loopback /verify
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
    restart: "no"
