<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Cloud Rescue Challenge</text>
  <text x="360" y="57" text-anchor="middle" font-size="12" fill="#475569">Compare symptoms, investigate through SSM, restore the existing frontend</text>

  <rect x="24" y="105" width="154" height="88" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
  <rect x="24" y="105" width="154" height="28" rx="8" fill="#2563EB"/>
  <rect x="24" y="125" width="154" height="8" fill="#2563EB"/>
  <text x="101" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Participant</text>
  <text x="101" y="154" text-anchor="middle" font-size="11" fill="#334155">SSM Session Manager</text>
  <text x="101" y="172" text-anchor="middle" font-size="11" fill="#334155">systemd + journal</text>

  <rect x="286" y="88" width="148" height="64" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="360" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">nginx frontend</text>
  <text x="360" y="134" text-anchor="middle" font-size="11" fill="#9A3412">initially stopped</text>

  <rect x="286" y="178" width="148" height="64" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Python API</text>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#166534">/healthz = 200</text>

  <rect x="542" y="105" width="154" height="88" rx="8" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
  <rect x="542" y="105" width="154" height="28" rx="8" fill="#7C3AED"/>
  <rect x="542" y="125" width="154" height="8" fill="#7C3AED"/>
  <text x="619" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Recovery check</text>
  <text x="619" y="154" text-anchor="middle" font-size="11" fill="#334155">localhost-only</text>
  <text x="619" y="172" text-anchor="middle" font-size="11" fill="#334155">returns per-deploy flag</text>

  <line x1="178" y1="149" x2="282" y2="121" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="123" text-anchor="middle" font-size="10" fill="#475569">restore</text>
  <line x1="178" y1="164" x2="282" y2="207" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="229" y="198" text-anchor="middle" font-size="10" fill="#475569">compare</text>
  <line x1="434" y1="121" x2="538" y2="145" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="434" y1="210" x2="538" y2="165" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="278" text-anchor="middle" font-size="12" fill="#475569">The flag appears only after localhost nginx returns HTTP 200.</text>
</svg>
