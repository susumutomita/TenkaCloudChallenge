# Every port binds to 127.0.0.1 only. This problem has no network surface for the
# learner to attack: it is played from the container terminal, and the published port
# exists only so the platform can post a submitted flag to /verify.
services:
  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      # The participant stage, explicitly. Without this, compose builds the
      # LAST stage -- `author` -- which carries reference/ and mutation.py.
      target: participant
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      VERIFY_PORT: "18095"
    ports:
      - "127.0.0.1:18095:18095"
    read_only: true
    # The only writable path in the container, and where the lab records which stages
    # have been cleared. Recreating the container starts that over; the readings take a
    # few minutes to redo once you know what they are, and a durable volume would be one
    # more thing that can be wrong.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The container is long-lived (the terminal attaches to it) and runs a single stdlib
    # HTTP server plus whatever the participant types. These bound both.
    mem_limit: 1g
    pids_limit: 128
