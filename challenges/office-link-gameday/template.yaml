          WEB_CSS = ':root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#122b3b;background:#f3f7f6;line-height:1.65;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:#086a64}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d96f11;outline-offset:4px}.topbar{background:#102d38;color:white;display:flex;justify-content:space-between;align-items:center;padding:18px max(22px,calc((100% - 1080px)/2));gap:16px}.topbar a{color:white;font-size:.85rem}.brand{font-weight:800;letter-spacing:.1em;text-decoration:none}main{max-width:1130px;margin:auto;padding:34px 25px 70px}.eyebrow{font-size:.8rem;letter-spacing:.1em;font-weight:800;color:#096a63;margin:0 0 8px}h1{font-size:clamp(2rem,4.5vw,3.8rem);line-height:1.25;letter-spacing:-.035em;white-space:pre-line;margin:10px 0 22px}h2{font-size:1.35rem;line-height:1.5;margin:10px 0 20px}h3{font-size:1.1rem;margin:8px 0}p{margin:12px 0}.lead{font-size:1.12rem;max-width:760px}.hero{background:white;border:1px solid #d7e3df;border-radius:24px;padding:clamp(25px,5vw,58px);box-shadow:0 12px 36px #102d3808}.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0}.journey>div{display:flex;flex-direction:column;gap:14px;background:#eaf5f0;border-radius:14px;padding:23px}.icon{font-size:2rem;color:#077269}.primary,.secondary,.missions button{border-radius:12px;font-weight:750;min-height:48px;padding:12px 22px;transition:background .15s}.primary{background:#086b62;color:white;border:2px solid #086b62;box-shadow:0 4px 0 #064d48;margin:16px 0 12px}.primary:hover{background:#054c45}.primary:disabled{opacity:.65;cursor:wait}.secondary{background:white;border:1.5px solid #79988f;color:#24453b}.secondary:disabled{opacity:.55;cursor:default}.boundary,footer{font-size:.88rem;color:#4e6570;max-width:900px;margin-top:26px}.missions{display:flex;gap:10px;margin:0 0 30px}.missions button{flex:1;background:#fff;border:1px solid #c8d8d2;color:#264a49;text-align:left;font-size:.9rem}.missions button.active{background:#d8f0e5;border:2px solid #086b62}.mission-heading h1{font-size:clamp(1.9rem,3.8vw,2.8rem)}.role-tip{font-size:.9rem;border-left:4px solid #d98621;padding:10px 15px;background:#fff6e9}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.role-card{background:#fff;border:1px solid #cbded6;border-top:5px solid #28a18a;border-radius:15px;padding:22px}.role-card:nth-child(2){border-top-color:#db923f}.role-card a{font-size:.85rem}.control-room{background:white;padding:28px;border-radius:20px;border:1px solid #cbded6}.control-room>h2{color:#566c74}.choices{display:flex;gap:12px;flex-wrap:wrap}.choice{flex:1;min-width:145px;display:flex;gap:10px;align-items:center;padding:18px 14px;border:2px solid #cfdbd7;border-radius:13px;cursor:pointer}.choice:has(input:checked){background:#e0f5eb;border-color:#08776b}.choice input{accent-color:#08776b;width:20px;height:20px;flex-shrink:0}.choice span{display:flex;flex-direction:column}.choice small{color:#48645f}.choice:hover{background:#f1f8f4}fieldset{border:0;padding:0;margin:0 0 24px}legend{font-weight:750;margin-bottom:10px}.hint-area{border-top:1px solid #dce5e1;padding-top:18px;margin-top:20px}.hint-area p{border-left:3px solid #e4bc73;padding-left:12px}.feedback{padding:18px 23px;border-radius:14px;margin:20px 0;font-weight:650}.error{background:#fff2df;color:#6d3c06;border:1px solid #c6924d}.success{background:#ddf3e3;color:#185032;border:1px solid #8fba9c}.lesson{background:#dff2e8;border:1px solid #98c5af;padding:26px;border-radius:18px;margin:20px 0}.lesson h2{margin-bottom:6px}.finished{background:#e0f1e8;padding:23px;border-radius:17px;margin:18px 0}.receipts{margin-top:30px;border-top:1px solid #cadbd2;padding-top:18px}.receipts>p{font-size:.92rem}.receipt{position:relative;background:white;border:1px dashed #789c8d;padding:20px;mar