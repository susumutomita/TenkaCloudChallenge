      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  WorkshopUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
          - Workshop
          - Arn
      AuthType: NONE
  UrlAccess:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Workshop
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  UrlInvocation:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Workshop
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true
  ParticipantViewerRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${TenkaCloudAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SignInLocalDevelopmentAccess
      Policies:
        - PolicyName: ConsoleSessionBaseline
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Resource: "*"
                Action:
                  - cloudshell:CreateEnvironment
                  - cloudshell:CreateSession
                  - cloudshell:GetEnvironmentStatus
                  - cloudshell:StartEnvironment
                  - cloudshell:StopEnvironment
                  - cloudshell:DeleteEnvironment
                  - cloudshell:PutCredentials
Outputs:
  GameUrl:
    Description: Team-private workshop link. Share only with your teammates.
    Value:
      Fn::Sub: ${WorkshopUrl.FunctionUrl}${PlayKey}/
  ParticipantViewerRoleArn:
    Value:
      Fn::GetAtt:
        - ParticipantViewerRole
        - Arn
  DeliveryFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${DeliverySecret}}
  DeliveryWhyFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${DeliveryWhySecret}}
  SharingFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${SharingSecret}}
  SharingWhyFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${SharingWhySecret}}
  RestoreFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${RestoreSecret}}
  RestoreWhyFlag:
    Description: Scorer only; filtered from participant outputs.
    Value:
      Fn::Sub: TC{${RestoreWhySecret}}
