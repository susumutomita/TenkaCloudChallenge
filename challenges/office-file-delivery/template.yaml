                  return response(200, assets[route][0], assets[route][1] + "; charset=utf-8") if route in assets else response(404, {"error": "not_found"})
              if method != "POST" or route not in ("api/state", "api/check"):
                  return response(405, {"error": "method_not_allowed"})
              raw = event.get("body") or ""
              if len(raw) > 8192:
                  return response(413, {"error": "too_large"})
              try:
                  if event.get("isBase64Encoded"):
                      raw = base64.b64decode(raw, validate=True).decode("utf-8")
                  data = json.loads(raw)
              except (ValueError, UnicodeError):
                  return response(400, {"error": "invalid_json"})
              if not isinstance(data, dict):
                  return response(400, {"error": "invalid_submission"})
              stage = read_receipt(data.get("token", ""))
              if stage is None:
                  return response(403, {"error": "invalid_progress"})
              if route == "api/state":
                  return response(200, view(stage, language))
              if type(data.get("stage")) is not int or data["stage"] != stage or stage == 2 * len(CURRICULUM["missions"]):
                  return response(409, {"error": "wrong_stage"})
              mission = CURRICULUM["missions"][stage // 2]
              if stage % 2:
                  if data.get("choice") != str(mission["correctChoice"]):
                      return response(200, {"correct": False, "message": choose({"ja": "構成図と、操作した前後の違いを仲間と見比べよう。", "en": "Compare the diagram and the before/after change together."}, language)})
                  evidence = {}
              else:
                  try:
                      inputs = data.get("inputs", {})
                      if not isinstance(inputs, dict) or any(not isinstance(value, str) or len(value) > 256 for value in inputs.values()):
                          return response(400, {"error": "invalid_inputs"})
                      checker = AwsChecks(configuration())
                      evidence = checker.run(mission["check"], inputs) if mission.get("inputs") else checker.run(mission["check"])
                  except NotReady as error:
                      return response(200, {"correct": False, "message": choose({"ja": "まだ確認できません。AWSの観測結果を手掛かりに、手順を確かめてください。", "en": "Not ready yet. Use the AWS observation to check your steps."}, language), "observation": OBSERVATIONS.get(str(error), str(error)) if language == "ja" else str(error)})
                  except Exception as error:
                      # Do not turn AccessDenied, timeouts, or malformed AWS replies into
                      # an incorrect answer. This is an operational error; keep progress.
                      code = getattr(error, "response", {}).get("Error", {}).get("Code", type(error).__name__)
                      return response(503, {"error": "aws_check_failed", "code": code})
              return response(200, {"correct": True, "evidence": evidence, **view(stage + 1, language)})

          CURRICULUM = {'id': 'office-file-delivery', 'labKind': 's3-save', 'title': {'ja': '拠点へ資料を届けよう — S3入門', 'en': 'Deliver a handover note — S3 basics'}, 'missions': [{'check': 's3-save', 'title': {'ja': 'チームの資料を保存して渡す', 'en': 'Save and hand over the team note'}, 'goal': {'ja': '別の拠点の仲間に案内を届けます。配布ファイルをS3へ置き、仲間が同じ保存場所から読めるようにしよう。', 'en': 'Teammates at another site need the handover note. Put the supplied file in S3 so they can read it from the same storage.'}, 'concept': {'ja': 'S3はファイルを保存するサービス。バケットは保存場所、オブジェクトは保存したファイル、キーはその名前です。今回はチームだけが読める場所を用意してあります。', 'en': 'S3 stores files. A bucket is a storage container, an object is a stored file, and its key is its name. A private team bucket is ready for you.'}, 'console': 's3', 'resourceKeys': ['bucketName', 'objectKey', 'fileContent'], 'steps': {'ja': ['下の「配布ファイルを保存」で handover.txt を手元へ保存する。', 'AWSコンソールで指定のバケットを開き、「アップロード」からそのファイルを保存する。公開設定は変えない。', '仲間へ担当を交代し、同じバケットから handover.txt をダウンロードして内容を照合。「操作できたか確かめる」を押す。'], 'en': ['Use Download the supplied file below to save handover.txt locally.', 'Open the specified bucket in AWS and upload the file. Keep public access blocked.', 'Swap teammates. Download handover.txt from the same bucket and compare its contents, then press Check my AWS changes.']}, 'success': {'ja': '現在の handover.txt が、配布した案内と同じ内容で保存されている。', 'en': 'The current handover.txt contains the supplied note.'}, 'question': {'ja': '仲間にも読んでもらうため、公開設定を変える必要はありましたか？', 'en': 'Did your teammate need you to make the bucket public?'}, 'choices': {'ja': ['ない。同じチームの権限で指定バケットを読める', 'ある。全世界へ公開しないと誰も読めない', 'ある。他チームのバケットへ移す必要がある'], 'en': ['No. The same team role can read the specified bucket', 'Yes. Everyone on the internet must have access', 'Yes. It must be moved into another team’s bucket']}, 'correctChoice': 0, 'hints': {'ja': ['ファイルの保存場所と、読める人の権限は別です。公開しなくても、チームの権限なら読めます。', '変更前：指定バケットに handover.txt がない。変更後：一覧に表示され、ダウンロードすると同じ案内が読めます。', '配布ファイルを保存 → 指定バケットへアップロード → 名前を照合 → 仲間がダウンロード → 確かめる。'], 'en': ['Storage and read p