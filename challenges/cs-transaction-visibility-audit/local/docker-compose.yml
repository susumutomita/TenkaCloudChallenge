# The service is reachable only through a host-loopback publish path and has no
# masqueraded route to the outside world.  The internal network carries no gateway;
# workshop-host exists only because Docker cannot publish from an internal-only network.
services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
      target: participant
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      WORKBENCH_PORT: "18320"
      VERIFIER_URL: http://verifier:18321/verify
    ports:
      - "127.0.0.1:18320:18320"
    depends_on:
      verifier:
        condition: service_healthy
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18320/api/config', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab
      - workshop-host

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      VERIFY_PORT: "18321"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18321/healthz', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab

networks:
  lab:
    internal: true
  workshop-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
