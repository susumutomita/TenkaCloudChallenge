<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">解放・再利用と制御値の誤更新</title><desc id="desc">古い受付票の箱0世代1が、再利用した制御オブジェクトの箱0世代2を指し、検査なしではAがBに変わる。世代検査で読み書きを拒否すればAを保つ。</desc><rect width="1100" height="500" fill="#eff4f8"/><g font-family="system-ui,sans-serif" fill="#182d43"><text x="30" y="45" font-size="27" font-weight="bold">安全な模型：古い参照 → 別データの読み書き → 意図しない処理</text><text x="30" y="80" font-size="17">箱番号は実アドレスではありません。A/B は固定の無害な表示処理です。</text><g font-size="20"><rect x="30" y="115" width="300" height="160" rx="12" fill="white" stroke="#54738c"/><text x="50" y="150">① allocate → release</text><text x="50" y="190">箱0 / 世代1 / 進捗 25%</text><text x="50" y="230">古い受付票は残る [0,1]</text><text x="350" y="200" font-size="35">→</text><rect x="405" y="115" width="280" height="160" rx="12" fill="white" stroke="#54738c"/><text x="425" y="150">② slot reuse</text><text x="425" y="190">箱0 / 世代2 / 制御 A</text><text x="425" y="230">同じ番号、別の物</text><text x="710" y="200" font-size="35">→</text><rect x="765" y="115" width="305" height="160" rx="12" fill="#fff0ce" stroke="#805000"/><text x="785" y="150">③ 古い受付票で read/write</text><text x="785" y="190">25% でなく A を読む</text><text x="785" y="230">B を書く → 制御が A→B</text><rect x="405" y="320" width="665" height="110" rx="12" fill="#e3eff9" stroke="#155088"/><text x="425" y="357">修正：受付票1 ≠ 箱2 → 読み書き拒否</text><text x="425" y="395">制御 A を維持 → A: 青いカード（正常処理も維持）</text><text x="30" y="355">不具合: B: 黄色いカード</text><text x="30" y="395">正常: 別の箱 → A</text></g><text x="30" y="470" font-size="17">一般原理の教材。PHP / CVE の再現ではありません。破壊が必ず任意コード実行に至るとは限りません。</text></g></svg>