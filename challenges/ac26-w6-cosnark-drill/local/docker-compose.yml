# The workbench service is reachable only through a host-loopback publish path and has
# no masqueraded route to the outside world. The verifier is not published at all: it
# is reachable only from the workbench, over the internal `lab` network, which carries
# no gateway -- `workshop-host` exists only because Docker cannot publish a port from an
# internal-only network.
#
# Issue 537/543 option B2: unlike the Week 4 drills, this problem's fixtures module
# derives the expected values next to the public numbers, so it lives only in the
# verifier image. The workbench fetches this deployment's public half from the
# verifier's `GET /public` (VERIFIER_PUBLIC_URL below); the split itself is the same
# plain two-service shape as ac26-w4-sumcheck-drill and ac26-w1-underconstraint --
# not a new mechanism.
name: ac26-w6-cosnark-drill
services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
      # The participant stage, explicitly. Without this, compose builds the LAST
      # stage -- `author` -- which carries fixtures/, reference/ and mutation.py.
      target: participant
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      WORKBENCH_PORT: "18163"
      VERIFIER_URL: http://verifier:18164/verify
      VERIFIER_PUBLIC_URL: http://verifier:18164/public
    ports:
      - "127.0.0.1:18163:18163"
    depends_on:
      verifier:
        condition: service_healthy
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18163/api/config', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab
      - workshop-host

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    environment:
      FLAG_SEED: ${FLAG_SEED:?FLAG_SEED must be provided by the platform}
      VERIFY_PORT: "18164"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18164/healthz', timeout=2).read()",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
      start_period: "2s"
    mem_limit: "1g"
    pids_limit: 128
    cpus: "1.0"
    restart: "no"
    networks:
      - lab

networks:
  lab:
    internal: true
  workshop-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
