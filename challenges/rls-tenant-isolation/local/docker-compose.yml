# Local-play problem container for rls-tenant-isolation.
# Bound to 127.0.0.1 only: the documents API and /verify never leave the box.
#
# Two participant routes reach the same database. Primary: the Portal's embedded
# container terminal (`runtime.terminal` names this service) — psql into the
# running Postgres and create the policies live; the grader inspects the live
# database on every submission, so no restart is involved. Secondary: edit
# ./solution/policies.sql on the host (bind-mounted in, read-only) and restart the
# container; entrypoint.sh re-applies schema/seed and reloads the policies from
# that file at every boot. There is no persistent volume — PGDATA lives in the
# container's writable layer — and entrypoint.sh drops every policy on
# public.documents before reloading, so terminal-route state does not survive a
# restart while the file route does.
name: rls-tenant-isolation
services:
  rls-tenant-isolation:
    build:
      context: .
      dockerfile: Dockerfile
      target: participant
    environment:
      # Unused by this problem (the challenge is structural, not a discovered
      # flag) but injected by `make local` for every local-play problem.
      FLAG_SEED: "${FLAG_SEED:-local-dev-seed}"
    volumes:
      # Live-edit the RLS policies without rebuilding the image.
      - "${RLS_SOLUTION_DIR:-./solution}:/app/solution:ro"
    ports:
      - "127.0.0.1:${RLS_APP_PORT:-18080}:8080" # documents API (challenge surface)
      - "127.0.0.1:${RLS_VERIFY_PORT:-18081}:8081" # loopback /verify
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: "3s"
      timeout: "3s"
      retries: 30
    restart: "no"
