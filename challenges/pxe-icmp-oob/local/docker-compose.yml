services:
  surface:
    build:
      context: .
      target: surface
    environment:
      EVALUATOR_URL: "http://verifier:8082"
    depends_on:
      verifier:
        condition: service_healthy
    ports: ["127.0.0.1:18080:8080"]
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
  verifier:
    build:
      context: .
      target: verifier
    environment:
      FLAG_SEED: "${FLAG_SEED:?Set a local fixture seed}"
    ports: ["127.0.0.1:18081:8081"]
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  lab:
    internal: true
