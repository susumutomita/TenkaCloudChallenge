name: eventbridge-delivery-discipline
services:
  participant:
    image: "${EVENTBRIDGE_PARTICIPANT_IMAGE:-eventbridge-delivery-discipline-participant:local}"
    build:
      context: .
      dockerfile: Dockerfile
      target: participant
    ports:
      - "${EVENTBRIDGE_WORKBENCH_BIND:-127.0.0.1}:${EVENTBRIDGE_WORKBENCH_PORT:-18120}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-no-connect.json
    healthcheck:
      test: ["CMD", "node", "-e", "try { process.kill(1, 0); process.exit(0) } catch { process.exit(1) }"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - participant

  verifier:
    image: "${EVENTBRIDGE_VERIFIER_IMAGE:-eventbridge-delivery-discipline-verifier:local}"
    build:
      context: .
      dockerfile: Dockerfile
      target: verifier
    ports:
      - "${EVENTBRIDGE_VERIFY_BIND:-127.0.0.1}:${EVENTBRIDGE_VERIFY_PORT:-18121}:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-no-connect.json
    healthcheck:
      test: ["CMD", "node", "-e", "try { process.kill(1, 0); process.exit(0) } catch { process.exit(1) }"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      - verifier

networks:
  participant: {}
  verifier: {}
