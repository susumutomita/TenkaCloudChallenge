# Local-play container for `sre-incident-readiness` (Issue 470).
#
# Loopback only. Unlike `agent-approval-gameday`, this problem never executes
# participant-supplied code — every editable surface is a typed JSON config
# (`config-store.mjs` validates it) consumed by a fixed server, so there is no code
# injection surface that needs a syscall-blocking seccomp profile. Capability drop,
# read-only root filesystem and non-root are still applied as baseline hardening.
#
# No external network is needed or granted: the "hidden load-generator" and the
# incident injector are just functions inside the same process (`world.mjs` `step()`),
# not separate services reachable over a network — so there is nothing resembling the
# issue's "control network" for a participant to even attempt to reach.
#
# `name:` is declared explicitly (Issue 521) so this project never shares Compose's
# directory-derived default name ("local") with a sibling problem's own local/
# directory. Two unnamed `local/` projects running side by side collide under that
# default, and `docker compose down --remove-orphans` run against either one can then
# remove the other problem's container as a same-project "orphan" — observed in this
# session when an unrelated experiment's cleanup took this container down mid-verify.
# An explicit name also makes `docker ps` show `sre-incident-readiness-<service>-1`
# instead of the ambiguous `local-<service>-1`.
name: sre-incident-readiness
services:
  sre-incident-readiness:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Per-deploy random secret injected by `make local`. The dependency name, the
      # incident timing, the evidence id prefix and every other seed-varying fact
      # (fixtures.mjs) come from this, so no two deploys share an answer.
      FLAG_SEED: "${FLAG_SEED:-local-dev-seed}"
      # 1 tick = 1 simulated second by default. Override for a compressed manual
      # verification run (see README "Fast local verification").
      SRE_TICK_MS: "${SRE_TICK_MS:-1000}"
      SRE_DURATION_MODE: "${SRE_DURATION_MODE:-90}"
      SRE_BUILD_TICKS: "${SRE_BUILD_TICKS:-}"
      SRE_CALIBRATE_TICKS: "${SRE_CALIBRATE_TICKS:-}"
      SRE_INCIDENT_TICKS: "${SRE_INCIDENT_TICKS:-}"
      SRE_STABILIZE_TICKS: "${SRE_STABILIZE_TICKS:-}"
    ports:
      - "127.0.0.1:18080:8080" # Browser Workbench, /metrics, /orders
      - "127.0.0.1:18081:8081" # loopback /verify
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: "2s"
      timeout: "3s"
      retries: 20
    restart: "no"
    networks:
      - sre-incident-readiness

networks:
  sre-incident-readiness: {}
