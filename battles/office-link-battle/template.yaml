AWSTemplateFormatVersion: 2010-09-09
Description: One real AWS recovery fault at a time, using existing uptime-flat scoring.
Parameters:
  NamePrefix:
    Type: String
    MaxLength: 80
    AllowedPattern: ^tc-[a-z0-9]+(-[a-z0-9]+)+$
  TenkaCloudAccountId:
    Type: String
    AllowedPattern: ^[0-9]{12}$
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  PlayKey:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 64
    AllowedPattern: ^[A-Za-z0-9]+$
  CooperationSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Private role-card seed; do not distribute to participants.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.77.0.0/28
      MapPublicIpOnLaunch: false
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: Subnet
      RouteTableId:
        Ref: RouteTable
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      GroupDescription: Workshop observation port; learners add HTTP
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  LabNic:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId:
        Ref: Subnet
      GroupSet:
        - Ref: LabSecurityGroup
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  LabAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: TenkaCloud:NamePrefix
          Value:
            Ref: NamePrefix
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName:
        Fn::Sub: ${NamePrefix}-session
      Roles:
        - Ref: InstanceRole
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: TenkaCloud:NamePrefix
              Value:
                Ref: NamePrefix
      LaunchTemplateData:
        ImageId:
          Ref: AmiId
        InstanceType: t3.micro
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        NetworkInterfaces:
          - NetworkInterfaceId:
              Ref: LabNic
            DeviceIndex: 0
            DeleteOnTermination: false
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -eu
              install -d -m 755 /opt/office-link
              cat > /opt/office-link/server.py <<'PY'
              """Public lab page and bounded, non-secret network observations on EC2."""
              import json
              import os
              import threading
              import urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              LAB = os.environ["LAB_NAME"]


              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/check":
                          try:
                              with urllib.request.urlopen("https://checkip.amazonaws.com/", timeout=3) as result:
                                  outbound = result.read(128).decode().strip()
                          except (OSError, ValueError):
                              # This is the observation being taught, not a successful check.
                              outbound = None
                          body = json.dumps({"lab": LAB, "outboundIp": outbound,
                              "sessionCommandRan": os.path.isfile("/tmp/office-link-visited"),
                              "sessionCommandAt": os.stat("/tmp/office-link-visited").st_mtime if os.path.isfile("/tmp/office-link-visited") else None}).encode()
                          mime = "application/json"
                      elif self.path == "/":
                          body = ("<!doctype html><html lang=en><meta charset=utf-8><title>Office Link</title>"
                              "<style>body{font:22px system-ui;max-width:45rem;margin:12vh auto;padding:2rem;background:#122940;color:white}"
                              "strong{color:#72e2b2}</style><h1>Office Link</h1><p><strong>Connected / つながりました！</strong></p>"
                              f"<p>{LAB}</p><p>Ask a teammate to check this page. / 仲間にも開いてもらおう。</p></html>").encode()
                          mime = "text/html; charset=utf-8"
                      else:
                          self.send_error(404)
                          return
                      self.send_response(200)
                      self.send_header("Content-Type", mime)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *args):
                      pass


              if __name__ == "__main__":
                  observation = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
                  threading.Thread(target=observation.serve_forever, daemon=True).start()
                  ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()

              PY
              cat > /etc/systemd/system/office-link.service <<'UNIT'
              [Unit]
              Description=Office Link lab page
              After=network.target
              [Service]
              Environment=LAB_NAME=${NamePrefix}
              ExecStart=/usr/bin/python3 /opt/office-link/server.py
              Restart=on-failure
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now office-link.service
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: TenkaCloud:NamePrefix
                Value:
                  Ref: NamePrefix
              - Key: Name
                Value:
                  Fn::Sub: ${NamePrefix}-server
          - ResourceType: volume
            Tags:
              - Key: TenkaCloud:NamePrefix
                Value:
                  Ref: NamePrefix
              - Key: Name
                Value:
                  Fn::Sub: ${NamePrefix}-server
        IamInstanceProfile:
          Arn:
            Fn::GetAtt:
              - InstanceProfile
              - Arn
  ParticipantViewerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${TenkaCloudAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SignInLocalDevelopmentAccess
      Policies:
        - PolicyName: OperateOnlyThisLab
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
