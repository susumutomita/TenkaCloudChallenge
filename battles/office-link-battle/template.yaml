          """Expected negative observations are distinct from operational failures."""
          class NotReady(Exception):
              """A documented observable condition has not been met yet."""


          def require(condition, message):
              if not condition:
                  raise NotReady(message)

          """Service exercises sharing the workshop's AWS client and progress protocol."""

          import json
          import re
          from datetime import datetime, timedelta, timezone


          class ServiceChecks:
              def dynamodb_item(self, status):
                  db=self.client('dynamodb')
                  try:
                      table=db.describe_table(TableName=self.config['tableName'])['Table']
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code')=='ResourceNotFoundException':
                          raise NotReady('Create the named DynamoDB table first') from error
                      raise
                  require(table.get('TableStatus')=='ACTIVE', 'Wait until the DynamoDB table is active')
                  require(table.get('KeySchema')==[{'AttributeName':'recordId','KeyType':'HASH'}] and table.get('AttributeDefinitions')==[{'AttributeName':'recordId','AttributeType':'S'}], 'Use recordId as the string partition key without a sort key')
                  require(table.get('BillingModeSummary',{}).get('BillingMode')=='PAY_PER_REQUEST', 'Use on-demand capacity for this table')
                  require(not table.get('GlobalSecondaryIndexes') and not table.get('LocalSecondaryIndexes'), 'This exercise needs no extra indexes')
                  item=db.get_item(TableName=self.config['tableName'],Key={'recordId':{'S':'handover'}},ConsistentRead=True).get('Item',{})
                  require(item.get('destination')=={'S':'YOKOHAMA'} and item.get('status')=={'S':status}, 'Find handover and check its destination and status')
                  return {'recordId':'handover','status':status,'read':'consistent'}

              def sqs_delivery(self):
                  sqs=self.client('sqs')
                  try:
                      url=sqs.get_queue_url(QueueName=self.config['queueName'],QueueOwnerAWSAccountId=self.config['accountId'])['QueueUrl']
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code') in ('AWS.SimpleQueueService.NonExistentQueue','QueueDoesNotExist'):
                          raise NotReady('Create the named Standard queue first') from error
                      raise
                  attrs=sqs.get_queue_attributes(QueueUrl=url,AttributeNames=['All'])['Attributes']
                  require(attrs.get('QueueArn')==self.config['queueArn'], 'Use the queue assigned to this team')
                  require(attrs.get('FifoQueue','false')=='false' and attrs.get('DelaySeconds')=='0' and attrs.get('MessageRetentionPeriod')=='345600' and attrs.get('VisibilityTimeout')=='30' and not attrs.get('RedrivePolicy'), 'Use Standard queue defaults: no delay, four-day retention, thirty-second visibility')
                  require(attrs.get('SqsManagedSseEnabled')=='true' and not attrs.get('KmsMasterKeyId'), 'Use SQS-managed encryption for this queue')
                  created=datetime.fromtimestamp(int(attrs['CreatedTimestamp']),timezone.utc)
                  now=datetime.now(timezone.utc)
                  require(timedelta(0) <= now-created < timedelta(hours=6), 'Use this event queue within six hours of creation')
                  counts={}
                  for name in ['NumberOfMessagesSent','NumberOfMessagesReceived','NumberOfMessagesDeleted']:
                      metric=self.client('cloudwatch').get_metric_statistics(Namespace='AWS/SQS',MetricName=name,
                          Dimensions=[{'Name':'QueueName','Value':self.config['queueName']}],StartTime=created,EndTime=now+timedelta(minutes=1),Period=60,Statistics=['Sum'])
                      counts[name]=sum(point.get('Sum',0) for point in metric.get('Datapoints',[]))
                  # Counts can include retries. We require evidence of each operation,
                  # not a unique-message count; emptiness alone can never complete.
                  require(all(count>0 for count in counts.values()), 'Wait for AWS to record send, receive, and delete operations; then check again')
                  require(all(attrs.get(name)=='0' for name in ['ApproximateNumberOfMessages','ApproximateNumberOfMessagesNotVisible','ApproximateNumberOfMessagesDelayed']), 'Finish deleting received messages; receiving alone only hides them temporarily')
                  return {'send':'recorded','receive':'recorded','delete':'recorded','queue':'empty'}

              def cpu_alarm(self):
                  result=self.client('cloudwatch').describe_alarms(AlarmNames=[self.config['alarmName']],AlarmTypes=['MetricAlarm'])
                  alarms=result.get('MetricAlarms',[])
                  require(len(alarms)==1, 'Create the named CPU alarm first')
                  alarm=alarms[0]
                  require(alarm.get('Namespace')=='AWS/EC2' and alarm.get('MetricName')=='CPUUtilization' and alarm.get('Dimensions')==[{'Name':'InstanceId','Value':self.config['instanceId']}], 'Select CPUUtilization for the prepared EC2 instance')
                  require(alarm.get('Statistic')=='Average' and alarm.get('Period')==300 and alarm.get('EvaluationPeriods')==1 and alarm.get('DatapointsToAlarm',1)==1 and alarm.get('ComparisonOperator')=='GreaterThanThreshold' and alarm.get('Threshold')==80, 'Use average over five minutes, greater than eighty, with one evaluation')
                  require(not any(alarm.get(name) for name in ['AlarmActions','OKActions','InsufficientDataActions','Metrics']) and not alarm.get('ExtendedStatistic'), 'Create a simple metric alarm without notification or recovery actions')
                  return {'instanceId':self.config['instanceId'],'alarm':'configured','trigger':'not tested'}

              def s3_object(self):
                  s3 = self.client('s3')
                  name = self.config['bucketName']
                  block = s3.get_public_access_block(Bucket=name)['PublicAccessBlockConfiguration']
                  require(all(block.get(key) is True for key in ['BlockPublicAcls','IgnorePublicAcls','BlockPublicPolicy','RestrictPublicBuckets']), 'Keep all four S3 public access blocks enabled')
                  try:
                      result = s3.get_object(Bucket=name, Key=self.config['objectKey'])
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code') in ('NoSuchKey','NoSuchVersion'):
                          raise NotReady('The team file is not saved at the requested key yet') from error
                      raise
                  with result['Body'] as body:
                      data = body.read(8193)
                  try:
                      content=data.decode('utf-8-sig').replace('\r\n','\n').rstrip('\n')
                  except UnicodeError as error:
                      raise NotReady('The current file content differs from the team handover note') from error
                  require(content == self.config['fileContent'].rstrip('\n'), 'The current file content differs from the team handover note')
                  return {'bucket':name, 'key':self.config['objectKey'], 'content':'verified'}

              def s3_restore(self):
                  s3 = self.client('s3')
                  name = self.config['bucketName']
                  require(s3.get_bucket_versioning(Bucket=name).get('Status') == 'Enabled', 'Keep S3 versioning enabled')
                  result = self.s3_object()
                  versions = s3.list_object_versions(Bucket=name, Prefix=self.config['objectKey'], MaxKeys=1000)
                  matching = [v for v in versions.get('Versions',[]) if v['Key']==self.config['objectKey']]
                  require(len(matching) >= 3 and any(v.get('IsLatest') for v in matching), 'Restore the earlier content as a new current version')
                  # Listing a healthy old version alone cannot pass: s3_object reads the
                  # current object without VersionId. Participants cannot delete history.
                  return {**result, 'versions':'preserved', 'currentVersion':'restored'}

              def lambda_record(self, inputs, include_destination=False):
                  receipt=inputs.get('receipt','')
                  require(isinstance(receipt,str) and re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',receipt) is not None, 'Copy the receipt from your Lambda execution result')
                  logs=self.client('logs')
                  request={'logGroupName':self.config['studentLogGroup'],'filterPattern':'"'+receipt+'"','limit':100}
                  previous=None
                  while True:
                      response=logs.filter_log_events(**request)
                      for event in response.get('events',[]):
                          try: record=json.loads(event['message'])
                          except (ValueError,UnicodeError): continue  # Other runtime log lines are not our receipt.
                          if not isinstance(record,dict): continue
                          if record.get('receipt')!=receipt or record.get('team')!=self.config['namePrefix'] or record.get('parcels')!=3:
                              continue
                          if include_destination:
                              require(inputs.get('destination','').strip()==record.get('destination'), 'Read the destination in the log for this receipt')
                          return {'receipt':receipt,'execution':'verified','log':'verified' if include_destination else 'recorded'}
                      token=response.get('nextToken')
                      if not token or token==previous: break
                      previous=token;request['nextToken']=token
                  raise NotReady('The execution receipt is not in this function log yet')

          """AWS observations for the introductory workshop family.

          Resource identities come only from the deployed stack, never from a submitted
          ARN or URL. Clients are injected in unit tests; production uses the AWS SDK.
          No check converts an AWS error into a successful or empty observation.
          """
          import ipaddress
          import json
          import urllib.request
          import urllib.error




          def tags_match(resource, prefix):
              return any(t.get("Key") == "TenkaCloud:NamePrefix" and t.get("Value") == prefix
                         for t in resource.get("Tags", []))


          def fetch_json(url):
              # The caller constructs this URL from the stack's EC2 address. Never follow
              # a student's redirect to another team, metadata endpoint, or private host.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect, urllib.request.ProxyHandler({}))
              try:
                  with opener.open(url, timeout=4) as response:
                      require(response.status == 200, "HTTP response is not 200")
                      data = response.read(8193)
              except (urllib.error.URLError, TimeoutError) as error:
                  raise NotReady("The lab page could not be reached") from error
              require(len(data) <= 8192, "HTTP response is too large")
              try:
                  return json.loads(data)
              except (ValueError, UnicodeError) as error:
                  raise NotReady("The lab page returned invalid data") from error




          class AwsChecks(ServiceChecks):
              def __init__(self, config, clients=None, fetch=fetch_json):
                  self.config = config
                  self.clients = clients if clients is not None else {}
                  self.fetch = fetch

              def client(self, service):
                  if service not in self.clients:
                      import boto3
                      from botocore.config import Config
                      self.clients[service] = boto3.client(service, region_name=self.config["region"],
                          config=Config(connect_timeout=3, read_timeout=5, retries={"max_attempts": 1}))
                  return self.clients[service]

              def instance(self):
                  ec2 = self.client("ec2")
                  nic = ec2.describe_network_interfaces(NetworkInterfaceIds=[self.config["networkInterfaceId"]])["NetworkInterfaces"]
                  require(len(nic) == 1 and nic[0]["VpcId"] == self.config["vpcId"], "Lab network interface does not match")
                  instance_id = nic[0].get("Attachment", {}).get("InstanceId")
                  require(bool(instance_id), "The lab network interface has no running server yet")
                  reservations = ec2.describe_instances(InstanceIds=[instance_id])["Reservations"]
                  instances = [i for r in reservations for i in r.get("Instances", [])]
                  require(len(instances) == 1, "The lab server could not be identified")
                  instance = instances[0]
                  require(instance["VpcId"] == self.config["vpcId"] and instance["SubnetId"] == self.config["subnetId"], "Server is outside the lab network")
                  require(tags_match(instance, self.config["namePrefix"]), "Server does not belong to this lab")
                  require(instance["State"]["Name"] == "running", "Wait for the server to enter running state")
                  require(instance["ImageId"] == self.config["imageId"], "Server image differs from the lab image")
                  require(instance["InstanceType"] == self.config["instanceType"], "Server size differs from the lab size")
                  return instance, nic[0]

              def launch(self):
                  instance, _ = self.instance()
                  statuses = self.client("ec2").describe_instance_status(InstanceIds=[instance["InstanceId"]])["InstanceStatuses"]
                  require(len(statuses) == 1, "AWS has not reported the server checks yet")
                  require(all(statuses[0].get(key, {}).get("Status") == "ok" for key in ("SystemStatus", "InstanceStatus")), "Wait for both EC2 status checks to pass")
                  return {"instanceId": instance["InstanceId"], "state": "running", "checks": "ok"}

              def attached_gateway(self):
                  gateways = self.client("ec2").describe_internet_gateways(Filters=[{"Name": "attachment.vpc-id", "Values": [self.config["vpcId"]]}])["InternetGateways"]
                  require(len(gateways) == 1, "The lab VPC needs an attached internet gateway")
                  gateway = gateways[0]
                  require(tags_match(gateway, self.config["namePrefix"]), "Use the gateway created for this lab")
                  require(any(a.get("VpcId") == self.config["vpcId"] and a.get("State") == "available" for a in gateway.get("Attachments", [])), "Wait for the gateway attachment to become available")
                  return gateway["InternetGatewayId"]

              def gateway(self):
                  gateway_id = self.attached_gateway()
                  # Existing interfaces cannot request auto-assigned public IPv4 at
                  # launch. The host supplies one reserved EIP only after the learner
                  # connects the IGW. This is setup assistance, explicitly shown in UI.
                  ec2 = self.client("ec2")
                  addresses = ec2.describe_addresses(AllocationIds=[self.config["allocationId"]])["Addresses"]
                  require(len(addresses) == 1, "The host's lab address is unavailable")
                  address = addresses[0]
                  require(address.get("NetworkInterfaceId") in (None, self.config["networkInterfaceId"]), "The lab address is attached to a different resource")
                  if not address.get("AssociationId"):
                      ec2.associate_address(AllocationId=self.config["allocationId"], NetworkInterfaceId=self.config["networkInterfaceId"], AllowReassociation=False)
                  return {"gatewayId": gateway_id, "publicIp": address["PublicIp"]}

              def route_config(self):
                  gateway_id = self.attached_gateway()
                  tables = self.client("ec2").describe_route_tables(RouteTableIds=[self.config["routeTableId"]])["RouteTables"]
                  require(len(tables) == 1 and tables[0]["VpcId"] == self.config["vpcId"], "The route table does not belong to this lab")
                  table = tables[0]
                  require(any(a.get("SubnetId") == self.config["subnetId"] and a.get("AssociationState", {}).get("State") == "associated" for a in table.get("Associations", [])), "The route table is not associated with the lab subnet")
                  require(any(r.get("DestinationCidrBlock") == "0.0.0.0/0" and r.get("GatewayId") == gateway_id and r.get("State") == "active" for r in table.get("Routes", [])), "The subnet needs an active route to its attached internet gateway")
                  return gateway_id

              def server_response(self, port):
                  instance, nic = self.instance()
                  address = nic.get("Association", {}).get("PublicIp")
                  require(bool(address), "The lab server has no public address yet")
                  require(ipaddress.ip_address(address).is_global, "The lab address must be a public IP")
                  data = self.fetch(f"http://{address}:{port}/check")
                  require(isinstance(data, dict) and data.get("lab") == self.config["namePrefix"], "The responding server is not this team's lab")
                  return instance, address, data

              def route(self):
                  gateway_id = self.route_config()
                  _, address, data = self.server_response(8080)
                  require(data.get("outboundIp") == address, "The lab server's outbound HTTPS check did not succeed")
                  return {"gatewayId": gateway_id, "outboundHttps": True}

              def session(self, after=0):
                  instance, _, data = self.server_response(8080)
                  require(instance.get("IamInstanceProfile", {}).get("Arn") == self.config["instanceProfileArn"], "The lab's Session Manager role is not attached")
                  require(data.get("sessionCommandRan") is True, "Run the workshop check command inside your Session Manager session")
                  if after:
                      require(isinstance(data.get("sessionCommandAt"), (int, float)) and data['sessionCommandAt'] >= after, "Run the check command again after this recovery round started")
                  expected_owner = f"arn:{self.config.get('partition', 'aws')}:sts::{self.config['accountId']}:assumed-role/{self.config['participantRoleName']}/"
                  ssm = self.client("ssm")
                  for state in ("Active", "History"):
                      request = {"State": state, "Filters": [{"key": "Target", "value": instance["InstanceId"]}]}
                      while True:
                          result = ssm.describe_sessions(**request)
                          if any(s.get("Target") == instance["InstanceId"] and s.get("Owner", "").startswith(expected_owner)
                                 and (not after or (s.get('StartDate') is not None and s['StartDate'].timestamp() >= after)) for s in result.get("Sessions", [])):
                              return {"instanceId": instance["InstanceId"], "session": "verified", "command": "verified"}
                          if not result.get("NextToken"):
                              break
                          request["NextToken"] = result["NextToken"]
                  raise NotReady("No Session Manager session from this team's participant role was found")

              def http(self):
                  self.route_config()
                  instance, nic = self.instance()
                  # Additional attached groups could make a too-wide rule effective even
                  # if the expected group looks correct. Check the actual NIC's groups.
                  require({g["GroupId"] for g in nic.get("Groups", [])} == {self.config["securityGroupId"]}, "Use only the lab security group")
                  groups = self.client("ec2").describe_security_groups(GroupIds=[self.config["securityGroupId"]])["SecurityGroups"]
                  require(len(groups) == 1 and groups[0]["VpcId"] == self.config["vpcId"], "Security group does not belong to the lab")
                  required = ("tcp", 80, 80, self.config["httpSourceCidr"])
                  control = ("tcp", 8080, 8080, "0.0.0.0/0")
                  actual = set()
                  for permission in groups[0].get("IpPermissions", []):
                      require(not permission.get("Ipv6Ranges") and not permission.get("UserIdGroupPairs") and not permission.get("PrefixListIds"), "Remove unrelated inbound permissions")
                      for source in permission.get("IpRanges", []):
                          actual.add((permission.get("IpProtocol"), permission.get("FromPort"), permission.get("ToPort"), source["CidrIp"]))
                  require(actual == {required, control}, "Allow the requested HTTP source and keep only the lab's fixed observation port")
                  _, address, data = self.server_response(80)
                  require(data.get("outboundIp") == address, "The lab server's outbound HTTPS check did not succeed")
                  return {"instanceId": instance["InstanceId"], "httpStatus": 200, "sourceCidr": self.config["httpSourceCidr"]}

              def run(self, kind, inputs=None):
                  if kind in ("dynamodb-create", "dynamodb-update"):
                      return self.dynamodb_item("waiting" if kind == "dynamodb-create" else "done")
                  if kind in ("lambda-run", "lambda-logs"):
                      return self.lambda_record(inputs or {}, kind == "lambda-logs")
                  allowed = {"launch": self.launch, "gateway": self.gateway, "route": self.route,
                             "session": self.session, "http": self.http, "s3-save": self.s3_object, "s3-restore": self.s3_restore,
                             "sqs": self.sqs_delivery, "cpu-alarm": self.cpu_alarm}
                  if kind not in allowed:
                      raise ValueError("Unsupported AWS check")
                  return allowed[kind]()

          """One reversible fault per team. The operator function has no public URL."""
          import json
          import time


          class Conflict(Exception):
              pass


          class StateStore:
              def __init__(self, client, table):
                  self.client,self.table=client,table

              def read(self):
                  item=self.client.get_item(TableName=self.table,Key={'id':{'S':'round'}},ConsistentRead=True).get('Item')
                  if not item:return {'revision':0,'index':0,'phase':'idle'}
                  return json.loads(item['payload']['S'])

              def save(self, old, new):
                  value={**new,'revision':old['revision']+1}
                  args={'TableName':self.table,'Item':{'id':{'S':'round'},'revision':{'N':str(value['revision'])},'payload':{'S':json.dumps(value)}},
                      'ConditionExpression':'attribute_not_exists(id)' if old['revision']==0 else '#revision = :revision'}
                  if old['revision']:
                      args.update(ExpressionAttributeNames={'#revision':'revision'},ExpressionAttributeValues={':revision':{'N':str(old['revision'])}})
                  try:self.client.put_item(**args)
                  except Exception as error:
                      if getattr(error,'response',{}).get('Error',{}).get('Code')=='ConditionalCheckFailedException':raise Conflict('State changed; refresh') from error
                      raise
                  return value


          KINDS=('gateway','route','role','http')


          class Battle:
              def __init__(self, checks, store, now=None):
                  self.checks,self.store,self.config=checks,store,checks.config
                  self.now=now or time.time

              def health(self):
                  # The prepared server must actually answer, and the management role
                  # must be attached. A successful Lambda URL alone earns nothing.
                  self.checks.gateway()  # Re-associate the reserved IP only after the learner attaches the IGW.
                  self.checks.http()
                  instance,_nic=self.checks.instance()
                  if instance.get('IamInstanceProfile',{}).get('Arn')!=self.config['instanceProfileArn']:
                      raise NotReady('Attach the prepared EC2 role to restore management access')
                  state=self.store.read()
                  if state.get('kind')=='role' and state['phase']=='active':
                      self.checks.session(after=state['startedAt'])
                  return {'http':200,'managementRole':'attached'}

              def start(self, kind):
                  old=self.store.read()
                  if old['phase']!='idle' or old['index']>=len(KINDS) or KINDS[old['index']]!=kind:
                      raise Conflict('Finish the current round and explanation before starting the next')
                  self.health()
                  active=self.store.save(old,{**old,'phase':'applying','kind':kind,'startedAt':int(self.now()),'deadline':int(self.now())+600})
                  try:
                      self.apply(kind)
                  except Exception:
                      # Keep authority/state visible. Watchdog retries recovery even if
                      # an API applied the mutation and the response was lost.
                      self.store.save(active,{**active,'phase':'restoring','deadline':int(self.now())})
                      raise
                  return self.store.save(active,{**active,'phase':'active'})

              def verify(self, revision=None):
                  old=self.store.read()
                  if revision is not None and old['revision']!=revision:raise Conflict('State changed; refresh')
                  if old['phase']!='active':raise Conflict('Refresh the round before checking')
                  self.health()
                  return self.store.save(old,{**old,'phase':'review','recoveredBy':'team'})

              def explain(self, choice, revision=None):
                  old=self.store.read()
                  if revision is not None and old['revision']!=revision:raise Conflict('State changed; refresh')
                  if old['phase']!='review':raise Conflict('Check recovery before the explanation')
                  if choice != str(ROUNDS[old['index']]['correctChoice']):return False
                  self.store.save(old,{'phase':'idle','index':old['index']+1,'revision':old['revision']})
                  return True

              def recover(self, force=False):
                  old=self.store.read()
                  if old['phase'] not in ('active','applying','restoring'):return old
                  if old['phase']=='restoring' and self.now()<old.get('recoverAfter',0):return old
                  if not force and old['phase']=='applying' and self.now()<old['deadline']:raise Conflict('Fault is still being applied')
                  if not force and self.now()<old['deadline']:return old
                  # A recovery lease exceeds the operator Lambda's 120-second timeout.
                  # Duplicate timer deliveries must not restore concurrently.
                  state=self.store.save(old,{**old,'phase':'restoring','recoverAfter':int(self.now())+180})
                  self.restore(state['kind'])
                  self.health()
                  return self.store.save(state,{**state,'phase':'review','recoveredBy':'operator' if force else 'watchdog'})

              def apply(self, kind):
                  ec2=self.checks.client('ec2');c=self.config
                  instance,_nic=self.checks.instance()
                  if kind=='gateway':
                      addresses=ec2.describe_addresses(AllocationIds=[c['allocationId']])['Addresses']
                      if len(addresses)!=1 or addresses[0].get('NetworkInterfaceId')!=c['networkInterfaceId']:
                          raise ValueError('Unexpected public address owner')
                      ec2.disassociate_address(AssociationId=addresses[0]['AssociationId'])
                      # AWS refuses IGW detachment while a public address remains.
                      ec2.detach_internet_gateway(InternetGatewayId=c['gatewayId'],VpcId=c['vpcId'])
                  elif kind=='route':ec2.delete_route(RouteTableId=c['routeTableId'],DestinationCidrBlock='0.0.0.0/0')
                  elif kind=='role':
                      associations=ec2.describe_iam_instance_profile_associations(Filters=[{'Name':'instance-id','Values':[instance['InstanceId']]}])['IamInstanceProfileAssociations']
                      current=[a for a in associations if a['State']=='associated']
                      if len(current)!=1 or current[0]['IamInstanceProfile']['Arn']!=c['instanceProfileArn']:raise ValueError('Unexpected instance profile')
                      ec2.disassociate_iam_instance_profile(AssociationId=current[0]['AssociationId'])
                  elif kind=='http':ec2.revoke_security_group_ingress(GroupId=c['securityGroupId'],IpPermissions=[self.http_rule()])
                  else:raise ValueError('Unknown fault')

              def http_rule(self):return {'IpProtocol':'tcp','FromPort':80,'ToPort':80,'IpRanges':[{'CidrIp':self.config['httpSourceCidr']}]}

              def restore(self, kind):
                  ec2=self.checks.client('ec2');c=self.config
                  instance,_nic=self.checks.instance()
                  if kind=='gateway':
                      gateways=ec2.describe_internet_gateways(InternetGatewayIds=[c['gatewayId']])['InternetGateways']
                      if len(gateways)!=1:raise ValueError('Gateway absent')
                      attached=gateways[0].get('Attachments',[])
                      if any(a['VpcId']!=c['vpcId'] for a in attached):raise ValueError('Gateway attached elsewhere')
                      if not attached:ec2.attach_internet_gateway(InternetGatewayId=c['gatewayId'],VpcId=c['vpcId'])
                      self.checks.gateway()
                  elif kind=='route':
                      routes=ec2.describe_route_tables(RouteTableIds=[c['routeTableId']])['RouteTables']
                      if len(routes)!=1 or routes[0]['VpcId']!=c['vpcId']:raise ValueError('Unexpected route table')
                      action=ec2.replace_route if any(r.get('DestinationCidrBlock')=='0.0.0.0/0' for r in routes[0]['Routes']) else ec2.create_route
                      action(RouteTableId=c['routeTableId'],DestinationCidrBlock='0.0.0.0/0',GatewayId=c['gatewayId'])
                  elif kind=='role':
                      associations=ec2.describe_iam_instance_profile_associations(Filters=[{'Name':'instance-id','Values':[instance['InstanceId']]}])['IamInstanceProfileAssociations']
                      current=[a for a in associations if a['State'] in ('associated','associating')]
                      if not current:ec2.associate_iam_instance_profile(InstanceId=instance['InstanceId'],IamInstanceProfile={'Arn':c['instanceProfileArn']})
                      elif len(current)==1:
                          if current[0]['IamInstanceProfile']['Arn']!=c['instanceProfileArn']:
                              ec2.replace_iam_instance_profile_association(AssociationId=current[0]['AssociationId'],IamInstanceProfile={'Arn':c['instanceProfileArn']})
                      else:raise ValueError('Ambiguous profile associations')
                  elif kind=='http':
                      groups=ec2.describe_security_groups(GroupIds=[c['securityGroupId']])['SecurityGroups']
                      if len(groups)!=1 or groups[0]['VpcId']!=c['vpcId']:raise ValueError('Unexpected security group')
                      required=[self.http_rule(),{'IpProtocol':'tcp','FromPort':8080,'ToPort':8080,'IpRanges':[{'CidrIp':'0.0.0.0/0'}]}]
                      for rule in groups[0].get('IpPermissions',[]):
                          if rule not in required:ec2.revoke_security_group_ingress(GroupId=c['securityGroupId'],IpPermissions=[rule])
                      for rule in required:
                          try:ec2.authorize_security_group_ingress(GroupId=c['securityGroupId'],IpPermissions=[rule])
                          except Exception as error:
                              if getattr(error,'response',{}).get('Error',{}).get('Code')!='InvalidPermission.Duplicate':raise
                  else:raise ValueError('Unknown fault')

          """Four private role cards. The operator distributes one card per participant."""
          import hashlib
          import hmac


          class MemberRequired(Exception):
              pass


          def member_cards(secret):
              if len(secret) < 24:
                  raise ValueError('Cooperation secret too short')
              return [hmac.new(secret.encode(), ('member:' + str(i)).encode(), hashlib.sha256).hexdigest() for i in range(4)]


          class Cooperation:
              def __init__(self, engine, secret):
                  self.engine, self.secret = engine, secret

              def member(self, token):
                  if not isinstance(token, str):
                      raise MemberRequired('Use your own role card')
                  for index, value in enumerate(member_cards(self.secret)):
                      if hmac.compare_digest(token.encode(), value.encode()):
                          return index
                  raise MemberRequired('Use your own role card')

              def digits(self, index):
                  digest = hmac.new(self.secret.encode(), ('round:' + str(index)).encode(), hashlib.sha256).digest()
                  return [str(1 + value % 9) for value in digest[:4]]

              def personal(self, token, language):
                  member = self.member(token)
                  state = self.engine.store.read()
                  index = state['index']
                  if index >= len(KINDS):
                      return {'member': member, 'done': True}
                  if index == 1:
                      # Rotate the assignment; the team must reconstruct the network path.
                      nodes = [('ブラウザ', 'Browser'), ('インターネットゲートウェイ', 'Internet gateway'),
                               ('ルートテーブル', 'Route table'), ('EC2', 'EC2')]
                      position = (member + int(self.digits(index)[0])) % 4
                      clue = nodes[position][language == 'en']
                  else:
                      clue = self.digits(index)[member]
                  return {'member': member, 'clue': clue, 'operator': index % 4, 'explainer': (index + 1) % 4}

              def expected(self, index):
                  if index == 1:
                      shift = int(self.digits(index)[0]) % 4
                      return ''.join('ABCD'[(position - shift) % 4] for position in range(4))
                  digits = self.digits(index)
                  if index == 0:
                      return str(sum(map(int, digits)))
                  # In the last two rounds pairs exchange their two halves of the release key.
                  return ''.join(digits)

              def share(self, token, answer, revision=None):
                  member = self.member(token)
                  old = self.engine.store.read()
                  if revision is not None and old['revision'] != revision:
                      raise Conflict('State changed; refresh')
                  if old['phase'] not in ('active', 'review'):
                      raise Conflict('Wait for the round')
                  if not isinstance(answer, str) or answer.strip().upper() != self.expected(old['index']):
                      return False
                  joined = old.get('members', [])
                  if member in joined:
                      return True
                  self.engine.store.save(old, {**old, 'members': sorted([*joined, member])})
                  return True

              def require(self, token, operation, revision=None):
                  member = self.member(token)
                  state = self.engine.store.read()
                  if revision is not None and state['revision'] != revision:
                      raise Conflict('State changed; refresh')
                  if len(state.get('members', [])) != 4:
                      raise MemberRequired('Share the four clues before checking recovery')
                  expected = state['index'] % 4 if operation == 'check' else (state['index'] + 1) % 4
                  if member != expected:
                      raise MemberRequired('Pass this action to the assigned teammate')

              def assist(self, members):
                  """Operator-only absence recovery; no extra points and a visible assistance marker."""
                  if not isinstance(members, list) or any(type(i) is not int or i not in range(4) for i in members):
                      raise ValueError('Expected absent member numbers 0..3')
                  old = self.engine.store.read()
                  if old['phase'] not in ('active', 'review'):
                      raise Conflict('No active round')
                  return self.engine.store.save(old, {**old, 'members': sorted(set(old.get('members', []) + members)), 'assisted': True})

          """Participant board and real-health endpoint; no cloud fault action is public."""
          import base64
          import hmac
          import json
          import os
          from urllib.parse import parse_qs


          def choose(value,language):
              if isinstance(value,list):return [choose(v,language) for v in value]
              if isinstance(value,dict):
                  if 'ja' in value and 'en' in value:return value[language]
                  return {k:choose(v,language) for k,v in value.items() if k!='correctChoice'}
              return value


          def response(status,data,mime='application/json; charset=utf-8'):
              return {'statusCode':status,'headers':{'content-type':mime,'cache-control':'no-store','referrer-policy':'no-referrer','x-content-type-options':'nosniff',
                  'content-security-policy':"default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"},'body':data if isinstance(data,str) else json.dumps(data,ensure_ascii=False)}


          def battle():
              config=json.loads(os.environ['LAB_CONFIG'])
              checks=AwsChecks(config)
              return Battle(checks,StateStore(checks.client('dynamodb'),config['stateTable']))


          def state_view(engine,language):
              state=engine.store.read()
              public={key:state[key] for key in ('revision','index','phase','deadline','recoveredBy','members','assisted') if key in state}
              public['total']=len(ROUNDS)
              if state['index']<len(ROUNDS) and state['phase'] in ('active','review','restoring'):
                  public['round']=choose(ROUNDS[state['index']],language)
              public['resources']={key:engine.config[key] for key in ['region','serverName','publicIp','vpcId','subnetId','gatewayId','routeTableId','instanceProfileName','securityGroupId']}
              return public


          def handler(event,context=None):
              parts=event.get('rawPath','').split('/',2)
              secret=os.environ['PLAY_KEY']
              if len(secret)<24:raise ValueError('Capability key too short')
              if len(parts)!=3 or not hmac.compare_digest(parts[1].encode(),secret.encode()):return response(404,{'error':'not_found'})
              route=parts[2];method=event.get('requestContext',{}).get('http',{}).get('method','GET')
              language='en' if parse_qs(event.get('rawQueryString','')).get('lang')==['en'] else 'ja'
              if method=='GET' and route in ('','app.js','style.css'):
                  assets={'':(WEB_HTML,'text/html'),'app.js':(WEB_JS,'text/javascript'),'style.css':(WEB_CSS,'text/css')}
                  return response(200,assets[route][0],assets[route][1]+'; charset=utf-8')
              engine=battle()
              try:
                  if method=='GET' and route in ('health','health/'):
                      if engine.store.read()['phase'] in ('applying','restoring'):return response(503,{'status':'recovering'})
                      engine.health()
                      return response(200,{'status':'healthy'})
                  if method=='GET' and route=='api/state':return response(200,state_view(engine,language))
                  if method!='POST' or route not in ('api/check','api/explain','api/personal','api/share'):return response(405,{'error':'method_not_allowed'})
                  raw=event.get('body') or ''
                  if len(raw)>4096:return response(413,{'error':'too_large'})
                  try:
                      if event.get('isBase64Encoded'):raw=base64.b64decode(raw,validate=True).decode()
                      data=json.loads(raw)
                  except (ValueError,UnicodeError):return response(400,{'error':'invalid_json'})
                  if not isinstance(data,dict):return response(400,{'error':'invalid_submission'})
                  cooperation=Cooperation(engine,os.environ['COOPERATION_SECRET'])
                  if route=='api/personal':return response(200,cooperation.personal(data.get('card'),language))
                  state=engine.store.read()
                  if type(data.get('revision')) is not int or state['revision']!=data['revision']:raise Conflict('State changed; refresh')
                  if route=='api/share':
                      correct=cooperation.share(data.get('card'),data.get('answer'),data['revision'])
                      return response(200,{'correct':correct,**state_view(engine,language)})
                  cooperation.require(data.get('card'),route.split('/')[-1],data['revision'])
                  if route=='api/check':engine.verify(data['revision'])
                  elif not engine.explain(data.get('choice'),data['revision']):
                      return response(200,{'correct':False,'message':choose({'ja':'図と、直す前後の違いを相談してみよう。','en':'Discuss the diagram and the change before and after recovery.'},language)})
                  return response(200,{'correct':True,**state_view(engine,language)})
              except MemberRequired:
                  return response(403,{'error':'member_action_required'})
              except NotReady as error:
                  if route in ('health','health/'):return response(503,{'status':'unhealthy'})
                  return response(200,{'correct':False,'message':OBSERVATIONS.get(str(error),str(error)) if language=='ja' else str(error)})
              except Conflict:
                  return response(409,{'error':'round_changed'})
              except Exception as error:
                  code=getattr(error,'response',{}).get('Error',{}).get('Code',type(error).__name__)
                  return response(503,{'error':'aws_check_failed','code':code})


          def operator_handler(event,context=None):
              engine=battle()
              operation=event.get('operation') if isinstance(event,dict) else None
              if isinstance(event,dict) and event.get('source')=='aws.events':return engine.recover()
              if operation=='cards':return {'cards':[{'member':'ABCD'[i],'url':os.environ['GAME_URL']+'#card='+value} for i,value in enumerate(member_cards(os.environ['COOPERATION_SECRET']))]}
              if operation=='assist':return Cooperation(engine,os.environ['COOPERATION_SECRET']).assist(event.get('members'))
              if operation=='state':return engine.store.read()
              if operation=='start':return engine.start(event.get('kind'))
              if operation=='restore':return engine.recover(force=True)
              raise ValueError('Expected state, start, restore, cards or assist')

          ROUNDS = [{'kind': 'gateway', 'title': {'ja': '拠点が外へ出られない', 'en': 'The site cannot reach outside'}, 'symptom': {'ja': '本戦用ページに届きません。準備で学んだ「外への出口」を、本戦の構成で見比べよう。', 'en': 'The Battle page is unreachable. Compare this Battle’s internet exit with what you learned during preparation.'}, 'diagram': {'ja': 'VPC（拠点のネットワーク）→ 外への出口 → インターネット', 'en': 'VPC (site network) → internet exit → internet'}, 'hints': {'ja': ['IGW（インターネットゲートウェイ）は、VPCを外とつなぐ出口。存在するだけでなく、このVPCにつながっている必要があります。', '前：出口はあるが拠点から外れている。後：同じ出口をこのVPCへ付け直すと、通信の道が戻ります。', '指定のIGWを開く → アクション → VPCにアタッチ → 指定のVPCを選ぶ → 下で確認。公開IPの付け直しは検査側が行います。'], 'en': ['An internet gateway connects a VPC to the internet. It must be attached to this VPC, not merely exist.', 'Before: the exit exists but is detached. After: reattaching the same gateway reconnects the site.', 'Open the specified IGW → Actions → Attach to VPC → choose the specified VPC → check below. The checker re-associates the reserved public IP.']}, 'question': {'ja': '出口を用意しただけでは、なぜ届きませんでしたか？', 'en': 'Why was having a gateway alone insufficient?'}, 'choices': {'ja': ['このVPCへ接続されていなかったから', 'EC2をもう1台作る必要があったから', 'サーバーの名前が短かったから'], 'en': ['It was not attached to this VPC', 'A second EC2 was needed', 'The server name was too short']}, 'correctChoice': 0, 'explanationHints': {'ja': ['IGWはVPCとインターネットを結ぶ出口です。作成は出口を用意する操作、アタッチはその出口を拠点へつなぐ操作です。', '前：IGWは一覧にあるが、どのVPCにも付いていない。後：VPCのIDが接続先として表示される。数は同じ1個でも通信のつながりが変わります。', '「作っただけ」のIGWと図のVPCを見る → 足りないのは物の数か、物同士のつながりかを比べる → 必要な接続先を説明する選択肢を選ぼう。'], 'en': ['An IGW connects a VPC to the internet. Creating provides the gateway; attaching connects it to a site.', 'Before: the gateway exists without a VPC. After: its attachment shows the VPC ID. The gateway count stays one, but connectivity changes.', 'Compare the created gateway with the VPC in the diagram → decide whether a resource or a connection is missing → choose the explanation about that connection.']}}, {'kind': 'route', 'title': {'ja': '出口への道案内がない', 'en': 'The route to the exit is missing'}, 'symptom': {'ja': '出口はつながっています。サーバーが使う道案内を確かめよう。', 'en': 'The exit is attached. Check the directions the server uses.'}, 'diagram': {'ja': 'サブネット → ルートテーブル（道案内）→ IGW', 'en': 'Subnet → route table (directions) → IGW'}, 'hints': {'ja': ['ルートテーブルは宛先と進む先の組です。出口があっても、外への宛先がなければ通信は届きません。', '前：拠点内の道だけ。後：0.0.0.0/0（外向きの宛先）から指定IGWへ進む道がある。', '指定ルートテーブルを開く → ルートを編集 → 宛先0.0.0.0/0、ターゲットは指定IGW → 保存 → 下で確認。'], 'en': ['A route table pairs destinations with next hops. An attached gateway still needs a route toward it.', 'Before: local routes only. After: 0.0.0.0/0 points to the specified gateway.', 'Open the specified route table → Edit routes → destination 0.0.0.0/0, target the specified IGW → save → check.']}, 'question': {'ja': '直したのはどの関係ですか？', 'en': 'Which relationship did you repair?'}, 'choices': {'ja': ['外向きの宛先と、進む出口の対応', '誰がサーバーを操作してよいか', 'ページの文字の色'], 'en': ['External destinations and their next hop', 'Who may operate the server', 'The page text color']}, 'correctChoice': 0, 'explanationHints': {'ja': ['ルートテーブルは「どこへ行きたいか」という宛先と、「次にどこへ進むか」というターゲットを結び付ける道案内です。', '前：拠点内へ向かう行だけがある。後：外向きの宛先0.0.0.0/0に、ターゲットとしてIGWが対応する行が加わる。', '修復で足した行を見る → 宛先は0.0.0.0/0 → ターゲットは指定IGW。この2つを結ぶ関係を説明する選択肢を選ぼう。'], 'en': ['A route table pairs a destination (where traffic is going) with a target (its next hop).', 'Before: only the local route exists. After: an added row pairs destination 0.0.0.0/0 with the internet gateway target.', 'Inspect the repaired row → destination 0.0.0.0/0 → target the specified IGW. Select the explanation describing that pair.']}}, {'kind': 'role', 'title': {'ja': 'サーバーを管理する接続を戻す', 'en': 'Restore server management access'}, 'symptom': {'ja': 'ページは見えても、管理用のロール設定に不備があります。EC2が使う権限を確認しよう。ロールを直したら新しいSession Manager接続で sudo touch /tmp/office-link-visited（確認用ファイルを作る）を実行します。', 'en': 'The page may work, but its management role configuration is incomplete. Check the permissions attached to EC2. After repairing the role, open a new Session Manager session and run sudo 