口を開ける', 'en': 'Reopen the page entrance'}, 'symptom': {'ja': 'ネットワークはつながっています。ページを見る通信が、入口で止められていないか確かめよう。', 'en': 'The network is connected. Check whether the page’s traffic is blocked at its entrance.'}, 'diagram': {'ja': '仲間のブラウザ → セキュリティグループ（入口の許可）→ HTTP 80', 'en': 'Teammate’s browser → security group (entrance permissions) → HTTP 80'}, 'hints': {'ja': ['セキュリティグループは、どこから何番の通信を受け入れるかを決めます。このページはHTTPの80番を使います。', '前：観測用8080番だけ。後：8080番を残し、HTTP 80番の入口も許可される。', '指定グループ → インバウンドルールを編集 → HTTP / TCP 80 / 0.0.0.0/0を追加 → 8080番は残す → 保存 → 下で確認。'], 'en': ['A security group decides which sources and ports may enter. This page uses HTTP on port 80.', 'Before: only observation port 8080. After: port 8080 remains and HTTP port 80 is also permitted.', 'Open the specified group → Edit inbound rules → add HTTP / TCP 80 / 0.0.0.0/0 → keep port 8080 → save → check.']}, 'question': {'ja': '別拠点の設計です。利用者203.0.113.7/32だけがTCP 8443のページを開き、監視元198.51.100.8/32だけがTCP 9000を確認します。必要最小限の入口は？ この設問ではAWSを変更しません。', 'en': 'A different site serves its page on TCP 8443 only to user 203.0.113.7/32. Only monitor 198.51.100.8/32 checks TCP 9000. Which rules allow just these connections? Do not modify AWS for this question.'}, 'choices': {'ja': ['8443 ← 203.0.113.7/32、9000 ← 198.51.100.8/32', '前と同じ80・8080 ← 0.0.0.0/0', '8443・9000 ← 0.0.0.0/0', '8443 ← 198.51.100.8/32、9000 ← 203.0.113.7/32'], 'en': ['8443 from 203.0.113.7/32; 9000 from 198.51.100.8/32', 'Reuse 80 and 8080 from 0.0.0.0/0', '8443 and 9000 from 0.0.0.0/0', '8443 from 198.51.100.8/32; 9000 from 203.0.113.7/32']}, 'correctChoice': 0, 'explanationHints': {'ja': ['入口は「通信する相手」と「ポート番号」の組です。/32はそのIPアドレス1つだけ、0.0.0.0/0はすべての相手を意味します。', '例：ある人だけを9001番へ通すなら、その人のIP/32とTCP 9001を組にします。前の演習で使った番号をそのままコピーはできません。', '設問のページ利用者と8443番を組にする → 監視元と9000番を組にする → 相手が入れ替わっていないか、全員公開になっていないか確認して選ぼう。'], 'en': ['An entrance rule pairs a source with a port. /32 means one IP address; 0.0.0.0/0 means all sources.', 'Example: to admit one person on port 9001, pair that IP/32 with TCP 9001. Copying the earlier exercise ports would not work.', 'Pair the page user with 8443 → pair the monitor with 9000 → check that sources are neither swapped nor opened to everyone, then choose.']}}]
