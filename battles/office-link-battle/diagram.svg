<rect x="212" y="231" width="530" height="90" rx="14" fill="#fff3d8" stroke="#b38b32" stroke-width="2"/>
<g font-family="sans-serif" fill="#193733" text-anchor="middle" font-size="18"><text x="477" y="264">サーバーの中へ入る / Manage the server</text><text x="477" y="296">Session Manager + EC2のIAMロール / IAM role</text></g><path d="M746 275h101v-74" fill="none" stroke="#b38b32" stroke-width="3"/><path d="m841 210 6-12 6 12" fill="#b38b32"/>
