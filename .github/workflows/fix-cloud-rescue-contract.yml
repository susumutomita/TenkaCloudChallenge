name: fix-cloud-rescue-contract

on:
  push:
    branches:
      - feat/cloud-rescue-book
    paths:
      - .github/workflows/fix-cloud-rescue-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/cloud-rescue-book
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Fix scoring and operator documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          metadata_path = Path('challenges/cloud-rescue/metadata.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          metadata['scoring']['points'] = 100
          metadata_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          redteam = Path('battles/cloud-rescue-battle/redteam')
          redteam.mkdir(parents=True, exist_ok=True)
          (redteam / 'README.md').write_text('''# Cloud Rescue Battle operator guide\n\nThis document is for the operator or red team. Participants should not receive it before the Battle.\n\n## Disruption catalog\n\n| ID | Target | Action | Participant symptom | Automatic revert |\n| --- | --- | --- | --- | --- |\n| `frontend-down` | Target team EC2 | `systemctl stop nginx` | frontend probe fails while API can remain healthy | starts nginx after 600 seconds |\n| `api-down` | Target team EC2 | `systemctl stop tenkacloud-api` | API probe fails while frontend can remain healthy | starts the API after 600 seconds |\n\n## Targeting discipline\n\n- Fire a disruption only after the target team has registered both endpoints and received an initial successful score.\n- Select exactly one team and verify the resolved `InstanceId` belongs to that team before execution.\n- Do not modify Security Groups, IAM, VPC resources, or another team's account.\n- Do not fire the same disruption repeatedly while its previous revert is pending.\n- Record the team, disruption ID, execution time, command result, and scheduled revert time.\n\n## Recovery path\n\nParticipants recover through SSM Session Manager. They should inspect evidence before restarting a service. Typical checks are:\n\n```bash\nsystemctl status nginx tenkacloud-api\njournalctl -u nginx -u tenkacloud-api --no-pager -n 50\n```\n\nThe intended recovery commands are:\n\n```bash\nsudo systemctl start nginx\nsudo systemctl start tenkacloud-api\n```\n\nThe operator verifies recovery from the Participant Portal probes rather than trusting the command exit status alone.\n\n## Safety and abort conditions\n\nEvery disruption schedules an automatic revert after ten minutes. Stop further injections and manually run the relevant start command when:\n\n- SSM command execution fails or remains pending\n- the wrong team or instance was selected\n- both endpoints fail after a single-service disruption\n- the automatic revert was not scheduled\n- the participant cannot establish an SSM session\n\nAll actions must remain inside the selected team's EC2 instance.\n''', encoding='utf-8')
          PY
      - name: Regenerate catalog artifacts
        run: bun run reindex
      - name: Validate metadata
        run: bun run scripts/validate-problems.ts
      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/debug-cloud-rescue-validation.yml
          rm -f .github/workflows/fix-cloud-rescue-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenges/cloud-rescue/metadata.json battles/cloud-rescue-battle/redteam/README.md index.json cost-report.json .github/workflows/debug-cloud-rescue-validation.yml .github/workflows/fix-cloud-rescue-contract.yml
          git commit -m "fix: satisfy Cloud Rescue catalog contract"
          git push origin HEAD:feat/cloud-rescue-book
