name: generate-cloud-rescue-artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-cloud-rescue-artifacts.yml
      - challenges/cloud-rescue/**
      - battles/cloud-rescue-battle/**

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate
        run: bun run reindex
      - name: Validate
        run: make agent-gate
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rescue-generated-artifacts
          path: |
            index.json
            cost-report.json
