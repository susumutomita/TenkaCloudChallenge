name: ci

# Catalog-side CI for TenkaCloudChallenge.
#
# Validates every problems/{battles,challenges}/<id>/metadata.json against
# problems/SCHEMA.json + cross-refs the template.yaml Outputs / portal slot
# files referenced from metadata. The validator is a verbatim copy of the
# platform's scripts/validate-problems.ts (= same source of truth).
#
# Phase 2 will additionally check that publish.yml-produced S3 keys exist
# for the new commit, once the AWS IAM Role is bound.
#
# Shape: `suite` runs the test files in parallel shards, `checks` runs the
# generators and static validators, and `validate` is a no-op gate that both
# feed. `validate` exists so there is one stable check name in front of a
# matrix whose job names change whenever the shard count does.

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: suite (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Sharded because the suite's wall time tracks the size of the catalog, not
    # the size of a change: it runs each container problem's starter, reference,
    # mutation suite and /verify contract for real. It was ~5 min at 13 problems,
    # ~8 min at 43, and at 63 test files it reached the old 25-minute single-job
    # cap and was cancelled — which reads as a red X with no failing assertion,
    # the worst signal available.
    #
    # The cap below is a runaway guard, not a budget. When the catalog grows,
    # add a shard rather than minutes; scripts/validate-shard.test.ts checks the
    # matrix and the denominator below stay in agreement, so a half-done bump
    # fails loudly instead of silently skipping files.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        # actions/checkout v4.3.1 (= pin matches TenkaCloud main repo)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Neither job performs an authenticated git operation; it reads the
          # tree and runs repository scripts. Without this the checkout leaves a
          # token in .git/config for the life of the job, readable by everything
          # the suite executes — and the suite executes participant-shaped code.
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2 (= pin matches TenkaCloud main repo)
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install deps
        run: bun install --ignore-scripts

      - name: Run catalog test suite
        run: bun run scripts/validate-shard.ts --shard=${{ matrix.shard }}/4

  solvability:
    runs-on: ubuntu-latest
    # Its own job because sharding by file cannot split it: the gate probes every
    # problem inside a single test, so it lands wholly in whichever shard owns the
    # file and grows with the catalog. It took shard 1 to the 15-minute cap while
    # the other three finished in five to nine minutes.
    #
    # Splitting the gate's own work by suite shard is not the fix either — the other
    # three shards never execute the file, so they would probe nothing and each would
    # still print "no findings". SEPARATELY_SCHEDULED_FILES in
    # scripts/validate-shard.ts keeps it out of the matrix, and
    # scripts/solvability-audit.test.ts fails if this job stops naming it.
    timeout-minutes: 25
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install deps
        run: bun install --ignore-scripts

      - name: Run the solvability gate over the whole catalog
        run: bun test scripts/solvability-audit.test.ts

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install deps
        run: bun install --ignore-scripts

      # Keep both gates explicit in CI: TypeScript proves compiler invariants,
      # while ESLint covers promise handling and other type-aware semantics.
      - name: Typecheck catalog tooling
        run: bun run typecheck

      - name: Lint catalog tooling
        run: bun run lint

      - name: Validate problem metadata
        run: bun run scripts/validate-problems.ts

      # 問題は 1 問ずつ独立して deploy できなければならないので、PortalEditorSupport は
      # 共有 package ではなく各問題への複製で配っている。複製が仕様である以上、揃って
      # いることを機械が保証しないと、1 問だけ直した修正が他へ届かず問題ごとに挙動が
      # 変わる。中身は判定せず「全部同じか」だけを見る。
      - name: Check vendored workbench copies do not drift
        run: bun run scripts/check-workbench-vendoring.ts

      - name: Check CloudFormation templates
        run: |
          bun run scripts/check-template-ascii.ts
          bun run scripts/check-template-security.ts

      # 参加者の画面に配信される HTML / inline script の欠陥 (Issue 395 / 396)。
      # ソースを読むと正しく見える種類なので、目視レビューでは落ちない。
      # stackstack-base/ も走査対象なので、この step は check:problem --all では代替できない。
      - name: Check participant-visible surface
        run: bun run check:participant-surface

      # local play は空いているポートへ再割り当てするので、焼き込んだ 18080 は
      # 「別の問題を起動したまま起動した」瞬間に別問題を指す (Issue 399)。
      - name: Check no participant surface pins a reassignable port
        run: bun run check:local-play-urls

      # 出荷ゲートを 1 問ずつ回す (Issue 382)。第三者の PR / 独自問題という想定ケースで
      # 実際に使われるのと同じ入口を CI でも通し、「1 問だけ緑」と「カタログ全体が緑」が
      # 同じ検出ロジックで決まるようにする。列挙は index.json ではなく filesystem なので、
      # catalog に登録し忘れた新問題も素通りしない。
      - name: Check every problem against the shipping gate
        run: bun run check:problem --all

      # verifier 側の生成物。metadata と生成ブロックがずれたまま merge されると、
      # Portal から見える問題文と実際に採点される内容が食い違う。
      - name: Check generated course workbenches are up to date
        run: python3 scripts/generate-course-workbenches.py --check

      - name: Check simulator workload
        run: bun run validate:simulator-workload

      # Cross-repository capability coverage needs an immutable Simulator
      # checkout and is enforced by simulator-compatibility.yml. Do not replace
      # that pinned proof with a moving branch or a hidden clone in this job.

      # index.json is the platform-read catalog, regenerated from every
      # metadata.json by scripts/build-index.ts. --check fails if it is stale
      # (= a problem was added/edited without rerunning the generator), so a
      # new problem can never merge while invisible to the catalog.
      - name: Check index.json is up to date
        run: |
          bun run scripts/build-index.ts --check \
            || { echo "::error::index.json is stale. Run 'bun run reindex' and commit (or 'bun run setup' once to enable the auto-reindex hook)."; exit 1; }

      # cost-report.json is the static AWS cost / leftover-billing estimate for
      # every problem (#87 Phase A), regenerated from template.yaml + rate table
      # by scripts/estimate-cost.ts. --check fails if it is stale (= a template
      # changed cost-relevant resources without rerunning the generator),
      # so always-on / billing-risk drift is caught before merge.
      - name: Check cost-report.json is up to date
        run: |
          bun run cost:check \
            || { echo "::error::cost-report.json is stale. Run 'bun run reindex' and commit (or 'bun run setup' once to enable the auto-reindex hook)."; exit 1; }

      # GITHUB_TOKEN only raises the anonymous rate limit; the source repositories are
      # public and are read with contents:read. Without it this step ran on the
      # unauthenticated 60-requests-an-hour budget, started getting 403 partway
      # through, and reported the rest as `unreachable` — a different set on every run
      # of the same commit. course-drift.yml has always passed the token; this step was
      # the one that did not, which is why the scheduled job was green and every pull
      # request was red.
      - name: Check course references do not drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run course:drift

  rls-runtime:
    name: rls-tenant-isolation runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Verify clean RLS startup and scoring
        run: bun run rls:runtime

  eventbridge-runtime:
    name: eventbridge-delivery-discipline runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Verify isolated local runtime and scoring
        run: bun run eventbridge:runtime

  github-oidc-runtime:
    name: github-oidc-trust-boundary runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Verify isolated OIDC trust-policy runtime and cleanup
        run: bun run github-oidc:runtime

  signed-npm-runtime:
    name: signed-does-not-mean-safe runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Verify isolated npm-provenance triage runtime and cleanup
        run: bun run signed-npm:runtime

  validate:
    # One stable name in front of the matrix. `if: always()` is what makes this
    # run when a shard fails — and it is also what makes `needs:` stop gating, so
    # the result has to be asserted explicitly rather than implied.
    needs: [suite, solvability, checks, rls-runtime, eventbridge-runtime, github-oidc-runtime, signed-npm-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "suite=${{ needs.suite.result }} solvability=${{ needs.solvability.result }} checks=${{ needs.checks.result }} rls-runtime=${{ needs.rls-runtime.result }} eventbridge-runtime=${{ needs.eventbridge-runtime.result }} github-oidc-runtime=${{ needs.github-oidc-runtime.result }} signed-npm-runtime=${{ needs.signed-npm-runtime.result }}"
          test "${{ needs.suite.result }}" = "success"
          test "${{ needs.solvability.result }}" = "success"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.rls-runtime.result }}" = "success"
          test "${{ needs.eventbridge-runtime.result }}" = "success"
          test "${{ needs.github-oidc-runtime.result }}" = "success"
          test "${{ needs.signed-npm-runtime.result }}" = "success"
