name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install validator dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate catalog metadata and cross-references
        run: make agent-gate

      - name: Install ac26 crypto battle test dependencies
        working-directory: battles/ac26-crypto-battle/game
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test and typecheck ac26 crypto battle
        working-directory: battles/ac26-crypto-battle/game
        run: bun test $(find src -name "*.test.ts" ! -name "state-size.test.ts") && bun run typecheck

      # Issue #644: the local development harness. Its own package, so its own
      # install. Without these steps the harness would rot silently the first
      # time the reducer's or the portal's shapes moved -- which is exactly the
      # failure mode #643 found in the problem-local tests before PR #648.
      - name: Install ac26 crypto battle dev harness dependencies
        working-directory: battles/ac26-crypto-battle/dev
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test and typecheck ac26 crypto battle dev harness
        working-directory: battles/ac26-crypto-battle/dev
        run: bun test && bun run typecheck

  # Complete legal-transition traces exceed the five-minute metadata/unit budget.
  # Keep every case, splitting the three large rosters into independent jobs.
  battle-capacity:
    name: battle-capacity (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: small-rosters
            pattern: 'keeps the existing|12 teams /|the same forecast'
          - profile: rapid-leak-99
            pattern: '99 teams / rapid-leak:'
          - profile: rapid-prove-99
            pattern: '99 teams / rapid-prove:'
          - profile: reuse-99
            pattern: '99 teams / reuse:'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install game dependencies
        working-directory: battles/ac26-crypto-battle/game
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check complete retained histories and every transition size
        working-directory: battles/ac26-crypto-battle/game
        env:
          CASE_PATTERN: ${{ matrix.pattern }}
        run: bun test src/state-size.test.ts --test-name-pattern "$CASE_PATTERN"
