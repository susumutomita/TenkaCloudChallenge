name: Forensic Casebook
on:
  pull_request:
    paths:
      - 'battles/forensic-casebook/**'
      - '.github/workflows/forensic-casebook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: battles/forensic-casebook
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run test:browser
      - name: Keep credential-free participant screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forensic-casebook-practice-ui
          path: |
            battles/forensic-casebook/dev/evidence/identity-ja.png
            battles/forensic-casebook/dev/evidence/identity-en.png
            battles/forensic-casebook/dev/evidence/timeline-ja.png
            battles/forensic-casebook/dev/evidence/timeline-en.png
            battles/forensic-casebook/dev/evidence/recovery-ja.png
            battles/forensic-casebook/dev/evidence/recovery-en.png
            battles/forensic-casebook/dev/evidence/mobile-en.png
            battles/forensic-casebook/dev/evidence/mobile-ja-fresh.png
          retention-days: 3
          if-no-files-found: ignore
