name: finish-cloud-rescue-hardening

on:
  push:
    branches:
      - feat/cloud-rescue-book
    paths:
      - .github/workflows/finish-cloud-rescue-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finish-cloud-rescue-hardening.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/cloud-rescue-book
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Harden Challenge runtime
        shell: python
        run: |
          from pathlib import Path

          template = Path('challenges/cloud-rescue/template.yaml')
          text = template.read_text(encoding='utf-8')
          old_description = (
              '  Minimal Battle uptime sample. Single EC2 (Amazon Linux 2023, t3.micro) running\n'
              '  nginx (port 80) and python3 http.server (port 8080). Both endpoints expected to\n'
              '  return 200; HealthCheckLambda probes them every 1 minute and grants +100 pt\n'
              '  when both succeed.'
          )
          new_description = (
              '  Incident-response Challenge. A single EC2 runs an nginx frontend and a Python API.\n'
              '  The API starts healthy while nginx is deliberately stopped after a successful\n'
              '  setup. The learner connects through SSM, inspects evidence, and restores nginx.'
          )
          if old_description not in text:
              raise RuntimeError('challenge description block not found')
          text = text.replace(old_description, new_description, 1)

          old_setup = '''          systemctl enable nginx
          systemctl stop nginx || true
'''
          new_setup = '''          systemctl enable --now nginx
          curl -fsS http://127.0.0.1/ >/dev/null
          echo "frontend verified before incident injection" | systemd-cat -t cloud-rescue-setup
          systemctl stop nginx
          echo "initial incident injected: nginx stopped" | systemd-cat -t cloud-rescue-setup
'''
          if old_setup not in text:
              raise RuntimeError('nginx setup block not found')
          text = text.replace(old_setup, new_setup, 1)

          old_recovery = '''                  if self.path == "/recovery":
                      try:
'''
          new_recovery = '''                  if self.path == "/recovery":
                      if self.client_address[0] not in ("127.0.0.1", "::1"):
                          self.send_response(403)
                          self.send_header("Content-type", "application/json")
                          self.end_headers()
                          self.wfile.write(json.dumps({"ok": False, "reason": "localhost-only"}).encode())
                          return
                      try:
'''
          if old_recovery not in text:
              raise RuntimeError('recovery route block not found')
          text = text.replace(old_recovery, new_recovery, 1)
          template.write_text(text, encoding='utf-8')

          ja = Path('challenges/cloud-rescue/README.ja.md')
          text = ja.read_text(encoding='utf-8')
          old = '`/recovery`はlocalhostのnginxがHTTP 200を返すまでHTTP 503を返します。Challengeのflagは調査と復旧の導線を作るためのものです。継続状態の評価は`cloud-rescue-battle`で行います。'
          new = '`/recovery`はEC2内のlocalhostからだけ利用できます。nginxがHTTP 200を返すまではHTTP 503を返します。Challengeのflagは調査と復旧の導線を作る確認値であり、sudo利用者に対する秘密境界ではありません。継続状態の評価は`cloud-rescue-battle`で行います。'
          if old not in text:
              raise RuntimeError('Japanese recovery explanation not found')
          ja.write_text(text.replace(old, new, 1), encoding='utf-8')

          en = Path('challenges/cloud-rescue/README.md')
          text = en.read_text(encoding='utf-8')
          old = 'The recovery endpoint returns HTTP 503 until localhost nginx returns HTTP 200. The flag guides the Challenge; continuous state is assessed in `cloud-rescue-battle`.'
          new = 'The recovery endpoint is available only from localhost and returns HTTP 503 until nginx returns HTTP 200. The flag is a completion marker, not a secrecy boundary against a learner with sudo access. Continuous state is assessed in `cloud-rescue-battle`.'
          if old not in text:
              raise RuntimeError('English recovery explanation not found')
          en.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('battles/cloud-rescue-battle/redteam/README.ja.md').write_text('''# Cloud Rescue Battle 運営ガイド

この文書はoperatorまたはred team向けです。Battle開始前に参加者へ配布しません。

## 障害カタログ

| ID | 対象 | 操作 | 参加者が見る症状 | 自動revert |
| --- | --- | --- | --- | --- |
| `frontend-down` | 対象teamのEC2 | nginxを停止 | APIが正常なままfrontend probeが失敗する | 600秒後にnginxを起動 |
| `api-down` | 対象teamのEC2 | `tenkacloud-api`を停止 | frontendが正常なままAPI probeが失敗する | 600秒後にAPIを起動 |

## 発火前の確認

- 対象teamが2つのendpointを登録し、最初の得点を得ている
- 解決した`InstanceId`が対象teamのstackに属している
- 同じ障害のrevertが待機中ではない
- team、disruption ID、実行時刻、command結果、revert予定時刻を記録する

Security Group、IAM、VPC、別teamのaccountは変更しません。

## 中止条件

次の場合は追加発火を止めます。

- SSM commandが失敗するかpendingのままになる
- 対象teamまたはinstanceを誤る
- 1つのservice停止で両endpointが失敗する
- 自動revertを予約できない
- 参加者がSSM Session Managerへ接続できない

必要なserviceを手動で起動し、Participant Portalの外形probeで復旧を確認します。
''', encoding='utf-8')
      - name: Regenerate catalog artifacts
        run: bun run reindex
      - name: Validate changed contracts
        run: |
          bun run scripts/validate-problems.ts
          bun run scripts/check-template-ascii.ts
          bun run scripts/check-template-security.ts
          bun run scripts/build-index.ts --check
          bun run cost:check
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/finish-cloud-rescue-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenges/cloud-rescue battles/cloud-rescue-battle index.json cost-report.json .github/workflows/finish-cloud-rescue-hardening.yml
          git commit -m "fix: finish Cloud Rescue runtime hardening"
          git push origin HEAD:feat/cloud-rescue-book
