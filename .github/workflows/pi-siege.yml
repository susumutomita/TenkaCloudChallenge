name: pi-siege-prototype

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'battles/pi-siege/**'
      - 'battles/_pi-siege/**'
      - '.github/workflows/pi-siege.yml'
  push:
    branches: [main]
    paths:
      - 'battles/_pi-siege/**'
      - '.github/workflows/pi-siege.yml'
  workflow_dispatch:

concurrency:
  group: pi-siege-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: battles/_pi-siege
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
      - name: Install locked dependencies without scripts
        run: make install
      - name: Arithmetic, reducer, HTTP, packaging, types and independent checks
        run: make test typecheck reference-test
      - name: Install pinned Playwright Chromium and Linux dependencies
        run: bun node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Play four rounds using two Japanese browser seats
        run: make browser-test
      - name: Play the same match in English, including feedback and history
        run: BROWSER_LOCALE=en make browser-test
