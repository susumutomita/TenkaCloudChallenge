name: debug-cloud-rescue-validator

on:
  push:
    branches:
      - feat/cloud-rescue-book
    paths:
      - .github/workflows/debug-cloud-rescue-validator.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/debug-cloud-rescue-validator.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Capture validator output
        shell: bash
        run: |
          set +e
          bun run scripts/validate-problems.ts > cloud-rescue-validator.txt 2>&1
          echo $? > cloud-rescue-validator-status.txt
          exit 0
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rescue-validator
          path: |
            cloud-rescue-validator.txt
            cloud-rescue-validator-status.txt
