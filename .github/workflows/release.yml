name: release

# Cuts a release from the dispatched ref's head: creates the vX.Y.Z tag and the
# GitHub Release in one step. Exists because repository automation pushes with a
# branch-scoped credential that cannot push refs/tags; the workflow's own token
# can. Notes passed in `body` are prepended above GitHub's auto-generated
# "What's Changed" list, which is the format every release so far has used.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create (vX.Y.Z)"
        required: true
        type: string
      title:
        description: "Release title (defaults to the tag name)"
        required: false
        default: ""
        type: string
      body:
        description: "Markdown prepended above the auto-generated notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "version must look like v1.2.3, got: $VERSION"
            exit 1
          }

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $VERSION already exists; refusing to overwrite"
            exit 1
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes)
          if [ -n "$TITLE" ]; then
            args+=(--title "$TITLE")
          fi
          if [ -n "$BODY" ]; then
            args+=(--notes "$BODY")
          fi
          gh release create "$VERSION" "${args[@]}"
