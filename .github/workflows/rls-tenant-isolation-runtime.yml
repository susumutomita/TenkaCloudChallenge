name: rls-tenant-isolation-runtime

# Split out of ci.yml so an unrelated PR (a README, a different problem) no
# longer pays for booting the Postgres RLS Docker Compose lab. Shape matches
# the existing mcp-origin-guardian-runtime.yml precedent: its own workflow,
# scoped to main, path-filtered to what this proof actually depends on, with
# its own concurrency group. scripts/rls-tenant-isolation.test.ts asserts this
# workflow exists with this shape instead of asserting job wiring inside
# ci.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rls-tenant-isolation-runtime.yml"
      - "challenges/rls-tenant-isolation/**"
      - "scripts/verify-rls-tenant-isolation.ts"
      - "scripts/rls-tenant-isolation.test.ts"
      - "scripts/lib/rls-tenant-isolation.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rls-tenant-isolation-runtime.yml"
      - "challenges/rls-tenant-isolation/**"
      - "scripts/verify-rls-tenant-isolation.ts"
      - "scripts/rls-tenant-isolation.test.ts"
      - "scripts/lib/rls-tenant-isolation.ts"

permissions:
  contents: read

concurrency:
  group: rls-tenant-isolation-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rls-runtime:
    name: rls-tenant-isolation runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Verify clean RLS startup and scoring
        run: bun run rls:runtime
