name: symphony

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".symphony/**"
      - "scripts/symphony-*.ts"
      - "Makefile"
      - ".github/workflows/symphony.yml"
  push:
    branches: [main]
    paths:
      - ".symphony/**"
      - "scripts/symphony-*.ts"
      - "Makefile"
      - ".github/workflows/symphony.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: make symphony-validate
