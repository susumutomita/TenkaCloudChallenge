name: Agent AC26 workbench migration

on:
  push:
    branches:
      - agent/ac26-workbench-all
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-ac26-workbench-all
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: agent/ac26-workbench-all

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install catalogue dependencies
        run: bun install --ignore-scripts

      - name: Generate all Browser Workbenches
        run: |
          python3 -m py_compile \
            scripts/migrate-course-workbenches.py \
            scripts/restore-course-readmes.py \
            scripts/sanitize-course-workbench-docs.py
          python3 scripts/migrate-course-workbenches.py
          python3 scripts/restore-course-readmes.py
          python3 scripts/sanitize-course-workbench-docs.py
          python3 -m compileall -q challenges

      - name: Refresh generated catalogue files
        run: bun run reindex

      - name: Verify the portal-only delivery contract
        run: python3 scripts/verify-course-workbenches.py

      - name: Commit generated files to the PR branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenges index.json cost-report.json
          if git diff --cached --quiet; then
            echo "::error::The migration produced no generated changes."
            exit 1
          fi
          git commit -m "fix(course): preserve authored docs and add browser workbenches"
          git push origin HEAD:agent/ac26-workbench-all
