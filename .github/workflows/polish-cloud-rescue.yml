name: polish-cloud-rescue

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/polish-cloud-rescue.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/cloud-rescue-book
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Polish implementation and documentation
        shell: python
        run: |
          from pathlib import Path
          import json

          for filename in [
              'challenges/cloud-rescue/metadata.json',
              'battles/cloud-rescue-battle/metadata.json',
          ]:
              path = Path(filename)
              metadata = json.loads(path.read_text(encoding='utf-8'))
              metadata['status'] = 'draft'
              path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          template = Path('challenges/cloud-rescue/template.yaml')
          text = template.read_text(encoding='utf-8')
          text = text.replace(
              '  Minimal Battle uptime sample. Single EC2 (Amazon Linux 2023, t3.micro) running\n'
              '  nginx (port 80) and python3 http.server (port 8080). Both endpoints expected to\n'
              '  return 200; HealthCheckLambda probes them every 1 minute and grants +100 pt\n'
              '  when both succeed.',
              '  Incident-response Challenge. A single EC2 runs an nginx frontend and a Python API.\n'
              '  The API starts healthy while nginx is deliberately stopped after a successful\n'
              '  setup. The learner connects through SSM, inspects evidence, and restores nginx.'
          )
          text = text.replace(
              '          systemctl enable nginx\n          systemctl stop nginx || true\n',
              '          systemctl enable --now nginx\n'
              '          curl -fsS http://127.0.0.1/ >/dev/null\n'
              '          echo "frontend verified before incident injection" | systemd-cat -t cloud-rescue-setup\n'
              '          systemctl stop nginx\n'
              '          echo "initial incident injected: nginx stopped" | systemd-cat -t cloud-rescue-setup\n'
          )
          text = text.replace(
              '                  if self.path == "/recovery":\n                      try:',
              '                  if self.path == "/recovery":\n'
              '                      if self.client_address[0] not in ("127.0.0.1", "::1"):\n'
              '                          self.send_response(403)\n'
              '                          self.send_header("Content-type", "application/json")\n'
              '                          self.end_headers()\n'
              '                          self.wfile.write(json.dumps({"ok": False, "reason": "localhost-only"}).encode())\n'
              '                          return\n'
              '                      try:'
          )
          template.write_text(text, encoding='utf-8')

          challenge_ja = Path('challenges/cloud-rescue/README.ja.md')
          text = challenge_ja.read_text(encoding='utf-8')
          text = text.replace(
              '`/recovery`はlocalhostのnginxがHTTP 200を返すまでHTTP 503を返します。',
              '`/recovery`はEC2内のlocalhostからだけ利用できます。nginxがHTTP 200を返すまではHTTP 503を返します。'
          )
          text += '\n## flagの位置づけ\n\nこのChallengeのflagは、調査から復旧までの導線を作る確認値です。OS上でsudoを使える参加者に対する秘密境界ではありません。正常状態を継続できるかはBattle版の外形監視で評価します。\n'
          challenge_ja.write_text(text, encoding='utf-8')

          challenge_en = Path('challenges/cloud-rescue/README.md')
          text = challenge_en.read_text(encoding='utf-8')
          text = text.replace(
              'The recovery endpoint returns HTTP 503 until localhost nginx returns HTTP 200.',
              'The recovery endpoint is localhost-only and returns HTTP 503 until nginx returns HTTP 200.'
          )
          text += '\n## Role of the flag\n\nThe flag is a completion marker for the investigation and recovery path. It is not a secrecy boundary against a learner with sudo access on the instance. The Battle edition uses external probes to assess continued service health.\n'
          challenge_en.write_text(text, encoding='utf-8')

          Path('battles/cloud-rescue-battle/redteam/README.ja.md').write_text('''# Cloud Rescue Battle 運営ガイド\n\nこの文書はoperatorまたはred team向けです。Battle開始前に参加者へ配布しません。\n\n## 障害カタログ\n\n| ID | 対象 | 操作 | 参加者が見る症状 | 自動revert |\n| --- | --- | --- | --- | --- |\n| `frontend-down` | 対象チームのEC2 | nginxを停止 | APIが正常なままfrontend probeが失敗する | 600秒後にnginxを起動 |\n| `api-down` | 対象チームのEC2 | `tenkacloud-api`を停止 | frontendが正常なままAPI probeが失敗する | 600秒後にAPIを起動 |\n\n## 発火前の確認\n\n- 対象チームが2つのendpointを登録し、最初の得点を得ている\n- 解決した`InstanceId`が対象チームのstackに属している\n- 同じ障害のrevertが待機中ではない\n- team、disruption ID、実行時刻、revert予定時刻を記録する\n\nSecurity Group、IAM、VPC、別チームのaccountは変更しません。\n\n## 中止条件\n\nSSM commandが失敗する、対象を誤る、1つの障害で両endpointが落ちる、revertを予約できない、参加者がSSMへ接続できない場合は追加発火を止めます。必要なserviceを手動で起動し、Portalのprobeで復旧を確認します。\n''', encoding='utf-8')
      - name: Regenerate catalog artifacts
        run: bun run reindex
      - name: Validate and capture output
        id: validation
        shell: bash
        run: |
          set +e
          make agent-gate > cloud-rescue-agent-gate.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rescue-agent-gate
          path: cloud-rescue-agent-gate.txt
      - name: Commit polished implementation
        if: steps.validation.outputs.status == '0'
        run: |
          rm .github/workflows/polish-cloud-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenges/cloud-rescue battles/cloud-rescue-battle index.json cost-report.json .github/workflows/polish-cloud-rescue.yml
          git commit -m "fix: harden and document Cloud Rescue"
          git push origin HEAD:feat/cloud-rescue-book
      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
