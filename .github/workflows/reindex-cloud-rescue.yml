name: reindex-cloud-rescue

on:
  push:
    branches:
      - feat/cloud-rescue-book
    paths:
      - .github/workflows/reindex-cloud-rescue.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reindex-cloud-rescue.yml

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/cloud-rescue-book
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Regenerate catalog
        run: bun run reindex
      - name: Validate generated artifacts
        run: |
          bun run scripts/validate-problems.ts
          bun run scripts/check-template-ascii.ts
          bun run scripts/check-template-security.ts
          bun run scripts/build-index.ts --check
          bun run cost:check
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/reindex-cloud-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json cost-report.json .github/workflows/reindex-cloud-rescue.yml
          git commit -m "chore: regenerate Cloud Rescue catalog artifacts"
          git push origin HEAD:feat/cloud-rescue-book
