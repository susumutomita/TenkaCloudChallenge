name: Session defense prototype
on:
  pull_request:
    paths: ['battles/_session-defense/**', '.github/workflows/session-defense.yml']
  push:
    paths: ['battles/_session-defense/**', '.github/workflows/session-defense.yml']
permissions:
  contents: read
jobs:
  local-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battles/_session-defense
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: make install
      - run: make test typecheck
      - run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      - run: make browser-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-defense-browser-evidence
          path: battles/_session-defense/docs/evidence/*.png
