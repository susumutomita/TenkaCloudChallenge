name: tenant-boundary-duel-native-catalog

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'battles/tenant-boundary-duel/**'
      - 'SCHEMA.json'
      - 'scripts/native-coordination.test.ts'
      - 'scripts/validate-problems.ts'
      - '.github/workflows/tenant-boundary-duel.yml'
  push:
    branches: [main]
    paths:
      - 'battles/tenant-boundary-duel/**'
      - '.github/workflows/tenant-boundary-duel.yml'
  workflow_dispatch:

concurrency:
  group: tenant-boundary-duel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: battles/tenant-boundary-duel
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
      - name: Validate native catalog and runtime contract
        working-directory: .
        run: make install agent-gate && bun test scripts/native-coordination.test.ts
      - name: Install locked dependencies without scripts
        run: make install
      - name: Expression safety, game, HTTP, packaging and types
        run: make test typecheck
      - name: Install pinned Playwright Chromium and Linux dependencies
        run: bun node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Play four rounds with visible code editing and evidence
        run: make browser-test
