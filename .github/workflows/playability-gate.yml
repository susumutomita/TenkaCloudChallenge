name: playability-gate

# New problems and draft -> ready promotions need evidence that a participant can
# actually solve them. Source/unit/runtime CI proves implementation properties; it
# cannot turn a maintainer-authored solution run into a blind human playtest.
#
# Repository administrators must require the "playability-gate" job on main and
# restrict the playtest-verified label to human maintainers. Without that ruleset,
# this workflow is useful evidence but cannot stop an admin/bot bypass by itself.

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled

jobs:
  playability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the proposed tree and its base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Require coherent implementation and reviewed play evidence
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun run scripts/check-pr-playability.ts
